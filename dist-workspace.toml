[workspace]
members = ["cargo:."]

[dist]
cargo-dist-version = "0.33.1"
ci = "github"
installers = ["shell", "powershell", "homebrew", "npm"]
targets = ["aarch64-apple-darwin", "x86_64-apple-darwin", "aarch64-unknown-linux-gnu", "x86_64-unknown-linux-gnu", "x86_64-pc-windows-msvc"]
install-path = "CARGO_HOME"
install-updater = false
create-release = false
dispatch-releases = true
pr-run-mode = "plan"
# Dependabot keeps the generated release workflow's actions current;
# release.yml is kept by hand from what dist generates (see its header).
allow-dirty = ["ci"]
# Homebrew formula to the tap, npm package `@jadpo/jadpo` to npmjs.com.
npm-scope = "@jadpo"
tap = "jadpo-dev/homebrew-tap"
publish-jobs = ["homebrew", "npm"]
# Each archive gets a GitHub artifact attestation as it is built.
github-attestations = true
