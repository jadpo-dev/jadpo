# The performance spike's own tools (roadmap chunk 8.3; tools/bench/README.md):
# `load`, a closed-loop HTTP/1.1 load generator, and `pool`, a
# transaction-mode PostgreSQL pooler standing in for Hyperdrive under
# workerd. A separate workspace; its fast correctness tests are in the gate, not its timings.
[package]
name = "jadpo-bench"
version = "0.0.0"
edition = "2024"
publish = false
license = "Apache-2.0"

[dependencies]
libc = "=0.2.191"
serde_json = "=1.0.154"
tokio = { version = "=1.53.3", features = ["rt-multi-thread", "net", "io-util", "time", "macros", "sync"] }

[profile.release]
debug = false

# Its own workspace, so the repository's doesn't claim it.
[workspace]
