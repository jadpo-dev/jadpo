<title>Jadpo Language Reference</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,700&family=Atkinson+Hyperlegible:ital,wght@0,400;0,700;1,400&family=JetBrains+Mono:wght@400;600&display=swap">
<style>
/* Layout: three-column docs reader — area index, reading column, on-this-page; review notes set apart as a tinted band */
:root {
  --bg: #f6f8f7;
  --surface: #ffffff;
  --ink: #17221f;
  --muted: #5b6b66;
  --line: #d9e2df;
  --jade: #1f7a64;
  --jade-soft: #e3f1ec;
  --code-bg: #eef3f1;
  --term-bg: #16201d;
  --term-fg: #d6e2de;
  --err: #c2452f;
  --warn-bg: #fbf1dc;
  --warn-fg: #7a5410;
  --ok-bg: #e3f1ec;
  --ok-fg: #1d6b56;
  --bad-bg: #f9e4df;
  --bad-fg: #9b3523;
  --review-bg: #eef1f8;
  --review-line: #c9d1e6;
  --review-accent: #3d4f8f;
  --tok-kw: #7a3fa0;
  --tok-type: #1f6d8f;
  --tok-str: #8a5a12;
  --tok-num: #a1452b;
  --tok-com: #7b8a85;
  --display: "Bricolage Grotesque", "Avenir Next", system-ui, sans-serif;
  --body: "Atkinson Hyperlegible", "Segoe UI", system-ui, sans-serif;
  --mono: "JetBrains Mono", ui-monospace, "SF Mono", Menlo, monospace;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #111816; --surface: #17201d; --ink: #e2ebe8; --muted: #93a49f; --line: #2a3733;
    --jade: #5cc4a6; --jade-soft: #1b322b; --code-bg: #1c2724; --term-bg: #0c1210; --term-fg: #d6e2de;
    --err: #f08a74; --warn-bg: #3a2e14; --warn-fg: #f0cd86; --ok-bg: #173229; --ok-fg: #82d7bb;
    --bad-bg: #3b1f19; --bad-fg: #f3a593; --review-bg: #171d2c; --review-line: #2d3754; --review-accent: #a5b4ef;
    --tok-kw: #d3a3f0; --tok-type: #7cc8ea; --tok-str: #e8c27d; --tok-num: #f2a183; --tok-com: #73847f;
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #111816; --surface: #17201d; --ink: #e2ebe8; --muted: #93a49f; --line: #2a3733;
  --jade: #5cc4a6; --jade-soft: #1b322b; --code-bg: #1c2724; --term-bg: #0c1210; --term-fg: #d6e2de;
  --err: #f08a74; --warn-bg: #3a2e14; --warn-fg: #f0cd86; --ok-bg: #173229; --ok-fg: #82d7bb;
  --bad-bg: #3b1f19; --bad-fg: #f3a593; --review-bg: #171d2c; --review-line: #2d3754; --review-accent: #a5b4ef;
  --tok-kw: #d3a3f0; --tok-type: #7cc8ea; --tok-str: #e8c27d; --tok-num: #f2a183; --tok-com: #73847f;
  color-scheme: dark;
}

* { box-sizing: border-box; }
body { background: var(--bg); color: var(--ink); font-family: var(--body); font-size: 16.5px; line-height: 1.62; }

.topbar { display: flex; align-items: baseline; gap: 14px; flex-wrap: wrap; padding: 14px 24px; border-bottom: 1px solid var(--line); background: var(--surface); }
.brand { font-family: var(--display); font-weight: 700; font-size: 20px; letter-spacing: -0.01em; color: var(--ink); }
.brand span { color: var(--jade); }
.crumb { color: var(--muted); font-size: 14px; }
.source-note { margin-left: auto; font-family: var(--mono); font-size: 12px; color: var(--muted); }

.shell { display: grid; grid-template-columns: 250px minmax(0, 1fr) 210px; gap: 40px; max-width: 1280px; margin: 0 auto; padding-inline: 24px; padding-block: 32px 80px; }

.areas { position: sticky; top: calc(env(safe-area-inset-top, 0px) + 20px); align-self: start; font-size: 14px; }
.areas h2, .toc h2 { font-family: var(--body); font-size: 11.5px; letter-spacing: 0.09em; text-transform: uppercase; color: var(--muted); margin: 0 0 10px; font-weight: 700; }
.areas ol { list-style: none; margin: 0; padding: 0; display: grid; gap: 2px; }
.areas li a, .areas li span { display: grid; grid-template-columns: 26px 1fr; padding: 6px 10px; border-radius: 6px; text-decoration: none; color: var(--muted); }
.areas li .n { font-family: var(--mono); font-size: 12px; padding-top: 2px; font-variant-numeric: tabular-nums; }
.areas li a.current { background: var(--jade-soft); color: var(--ink); font-weight: 700; }
.areas li a.current .n { color: var(--jade); }
.areas li span { opacity: 0.6; }
.areas .legend { margin-top: 14px; color: var(--muted); font-size: 12.5px; line-height: 1.45; }

main { min-width: 0; max-width: 72ch; }
.eyebrow { font-family: var(--mono); font-size: 12.5px; color: var(--jade); letter-spacing: 0.02em; }
h1 { font-family: var(--display); font-weight: 700; font-size: clamp(32px, 5vw, 44px); line-height: 1.08; letter-spacing: -0.02em; margin: 6px 0 12px; text-wrap: balance; }
.lede { font-size: 19px; color: var(--muted); margin: 0 0 28px; max-width: 60ch; }
h2 { font-family: var(--display); font-weight: 700; font-size: 25px; letter-spacing: -0.01em; margin: 44px 0 10px; text-wrap: balance; scroll-margin-top: 20px; }
h3 { font-family: var(--display); font-weight: 500; font-size: 19px; margin: 28px 0 8px; }
p { margin: 0 0 14px; }
main ul { padding-left: 20px; margin: 0 0 16px; display: grid; gap: 6px; }
code { font-family: var(--mono); font-size: 0.88em; background: var(--code-bg); padding: 1px 5px; border-radius: 4px; }
a { color: var(--jade); }
a:focus-visible, button:focus-visible { outline: 2px solid var(--jade); outline-offset: 2px; }

.code { position: relative; margin: 14px 0 18px; border: 1px solid var(--line); border-radius: 8px; background: var(--code-bg); overflow: hidden; }
.code .label { display: flex; justify-content: space-between; align-items: center; gap: 8px; padding: 6px 12px; border-bottom: 1px solid var(--line); font-family: var(--mono); font-size: 11.5px; color: var(--muted); }
.code .label .check { color: var(--ok-fg); }
.code pre { margin: 0; padding: 14px 16px; overflow-x: auto; font-family: var(--mono); font-size: 13.5px; line-height: 1.6; }
.code pre code { background: none; padding: 0; font-size: inherit; }
.tok-kw { color: var(--tok-kw); font-weight: 600; }
.tok-type { color: var(--tok-type); }
.tok-str { color: var(--tok-str); }
.tok-num { color: var(--tok-num); }
.tok-com { color: var(--tok-com); font-style: italic; }

.diag { margin: 14px 0 22px; border-radius: 8px; background: var(--term-bg); color: var(--term-fg); overflow: hidden; }
.diag .label { padding: 6px 12px; font-family: var(--mono); font-size: 11.5px; color: #8fa29c; border-bottom: 1px solid #26332f; }
.diag pre { margin: 0; padding: 14px 16px; overflow-x: auto; font-family: var(--mono); font-size: 13px; line-height: 1.55; }
.diag .e { color: #ff8f78; font-weight: 600; }
.diag .caret { color: #ff8f78; }
.diag .dim { color: #7f938d; }
.diag .rule { color: #7fd3b8; }

.table-wrap { overflow-x: auto; margin: 14px 0 20px; border: 1px solid var(--line); border-radius: 8px; background: var(--surface); }
table { border-collapse: collapse; width: 100%; font-size: 15px; }
th, td { text-align: left; padding: 10px 14px; border-bottom: 1px solid var(--line); vertical-align: top; }
th { font-size: 12px; letter-spacing: 0.06em; text-transform: uppercase; color: var(--muted); font-weight: 700; }
tr:last-child td { border-bottom: 0; }

.review { margin-top: 56px; background: var(--review-bg); border: 1px solid var(--review-line); border-radius: 12px; padding-inline: 24px; padding-block: 8px 24px; }
.review > h2 { color: var(--review-accent); margin-top: 18px; }
.review-note { font-size: 14px; color: var(--muted); margin-top: -4px; }
.review .table-wrap { background: var(--surface); }
.chip { display: inline-block; white-space: nowrap; font-size: 12.5px; font-weight: 700; padding: 2px 9px; border-radius: 999px; }
.chip.ok { background: var(--ok-bg); color: var(--ok-fg); }
.chip.warn { background: var(--warn-bg); color: var(--warn-fg); }
.chip.bad { background: var(--bad-bg); color: var(--bad-fg); }

.questions { list-style: none; padding: 0; margin: 14px 0 0; display: grid; gap: 14px; }
.q { background: var(--surface); border: 1px solid var(--review-line); border-radius: 10px; padding: 16px 18px; display: grid; gap: 8px; }
.q h3 { margin: 0; font-size: 18px; display: flex; gap: 10px; align-items: baseline; }
.q h3 .qn { font-family: var(--mono); font-size: 13px; color: var(--review-accent); }
.q p { margin: 0; }
.rec { border-left: 3px solid var(--jade); padding-left: 12px; }
.rec strong { color: var(--jade); }
.decide { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 4px; }
.decide button { font: inherit; font-size: 14px; padding: 6px 14px; border-radius: 999px; border: 1px solid var(--line); background: var(--bg); color: var(--ink); cursor: pointer; }
.decide button[aria-pressed="true"] { background: var(--jade); border-color: var(--jade); color: var(--surface); }
.decide .hint { font-size: 12.5px; color: var(--muted); align-self: center; }

.toc { position: sticky; top: calc(env(safe-area-inset-top, 0px) + 20px); align-self: start; font-size: 14px; }
.toc ul { list-style: none; margin: 0; padding: 0; border-left: 1px solid var(--line); display: grid; gap: 2px; }
.toc a { display: block; padding: 4px 12px; color: var(--muted); text-decoration: none; }
.toc a:hover { color: var(--ink); }
.toc .review-link { color: var(--review-accent); }

@media (max-width: 1100px) {
  .shell { grid-template-columns: 220px minmax(0, 1fr); }
  .toc { display: none; }
}
@media (max-width: 760px) {
  body { font-size: 16px; }
  .topbar { padding: 12px 16px; }
  .source-note { margin-left: 0; width: 100%; }
  .shell { grid-template-columns: minmax(0, 1fr); padding-inline: 16px; padding-block: 20px 60px; gap: 20px; }
  .areas { position: static; }
  .areas ol { display: flex; gap: 6px; overflow-x: auto; padding-bottom: 4px; }
  .areas li a, .areas li span { display: inline-flex; gap: 6px; white-space: nowrap; border: 1px solid var(--line); }
  .areas .legend { display: none; }
  .review { padding-inline: 16px; }
}
@media (prefers-reduced-motion: no-preference) { html { scroll-behavior: smooth; } }

.code .label .broken { color: var(--err); font-weight: 600; }
.code .label .muted, .muted { color: var(--muted); }
.code.plain pre { color: var(--ink); }
main h4 { font-family: var(--display); font-weight: 700; font-size: 17px; margin: 26px 0 8px; }
.rule-heading { display: flex; flex-wrap: wrap; align-items: baseline; gap: 6px 12px; margin-top: 34px; padding-top: 18px; border-top: 1px solid var(--line); }
.rule-heading code { font-size: 14px; background: var(--jade-soft); color: var(--ink); }
.rule-heading .summary { font-family: var(--body); font-weight: 400; font-size: 16px; color: var(--muted); flex: 1 1 260px; min-width: 0; }
.comment-btn { font: inherit; font-size: 13px; padding: 4px 12px; border-radius: 999px; border: 1px solid var(--line); background: var(--surface); color: var(--muted); cursor: pointer; }
.comment-btn:hover { color: var(--ink); border-color: var(--jade); }
body:not(.can-comment) .comment-btn, body:not(.can-comment) .sel-comment { display: none; }
main h1 + p { font-size: 19px; color: var(--muted); max-width: 60ch; margin-bottom: 28px; }
.coverage { color: var(--ok-fg); font-weight: 700; margin-top: 24px; }
.gap { margin-top: 28px; padding: 14px 18px; border-radius: 10px; background: var(--warn-bg); color: var(--warn-fg); }
.gap h3 { margin-top: 0; }
.q h4 { font-family: var(--display); font-weight: 500; font-size: 18px; margin: 0; display: flex; gap: 10px; align-items: baseline; }
.q h4 .qn { font-family: var(--mono); font-size: 13px; color: var(--review-accent); }
.sel-comment { position: absolute; z-index: 10; font: inherit; font-size: 13px; font-weight: 700; padding: 6px 14px; border-radius: 999px; border: 0; background: var(--jade); color: var(--surface); box-shadow: 0 4px 14px rgb(0 0 0 / 0.18); cursor: pointer; }
.comment-hint { font-size: 13.5px; color: var(--muted); margin: -16px 0 26px; }
body:not(.can-comment) .comment-hint { display: none; }
</style>

<header class="topbar">
  <div class="brand">jad<span>po</span></div>
  <div class="crumb">Language reference</div>
  <div class="source-note">generated from {{source}}</div>
</header>

<div class="shell">
  <nav class="areas" aria-label="Language areas">
    <h2>Areas</h2>
    <ol>{{nav}}</ol>
    <p class="legend">Faded areas aren't written yet.</p>
  </nav>

  <main id="top">
    <div class="eyebrow">Area {{area}} · checked with {{checked}}</div>
{{content}}
  </main>

  <aside class="toc" aria-label="On this page">
    <h2>On this page</h2>
    <ul>{{toc}}</ul>
  </aside>
</div>
<button type="button" class="sel-comment" hidden>Comment</button>

<script>
(function () {
  var KW = ["module","import","public","type","function","action","query","route","job","entity","failure","service","config","application","principal","var","return","match","if","else","attempt","persist","test","fixture","true","false","none","identity","auth","output","run","path"];
  var re = /(\/\/[^\n]*)|("(?:[^"\\]|\\.)*")|\b(\d+)\b|\b([A-Z][A-Za-z0-9]*)\b|\b([a-z_][a-z0-9_]*)\b/g;
  function esc(s) { return s.replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;"); }
  document.querySelectorAll("code.jadpo").forEach(function (el) {
    var src = el.textContent, out = "", last = 0, m;
    re.lastIndex = 0;
    while ((m = re.exec(src))) {
      out += esc(src.slice(last, m.index));
      if (m[1]) out += '<span class="tok-com">' + esc(m[1]) + "</span>";
      else if (m[2]) out += '<span class="tok-str">' + esc(m[2]) + "</span>";
      else if (m[3]) out += '<span class="tok-num">' + m[3] + "</span>";
      else if (m[4]) out += '<span class="tok-type">' + m[4] + "</span>";
      else if (KW.indexOf(m[5]) !== -1) out += '<span class="tok-kw">' + m[5] + "</span>";
      else out += esc(m[0]);
      last = re.lastIndex;
    }
    el.innerHTML = out + esc(src.slice(last));
  });
})();

(async function () {
  var comments = null;
  try { comments = window.claude && window.claude.use ? await window.claude.use("comments") : null; } catch (e) { comments = null; }
  if (!comments) return;
  document.body.classList.add("can-comment");
  var main = document.querySelector("main");
  var button = document.querySelector(".sel-comment");
  var saved = null;

  function hide() { button.hidden = true; saved = null; }
  function off() { document.body.classList.remove("can-comment"); hide(); }
  function open(target) {
    comments.openComposer(target).catch(function (err) {
      if (err && (err.code === "unavailable" || err.code === "not_granted" || err.code === "capability_disabled")) off();
    });
  }

  document.addEventListener("selectionchange", function () {
    var sel = window.getSelection();
    if (!sel || sel.isCollapsed || !sel.rangeCount) return hide();
    var range = sel.getRangeAt(0);
    if (!main.contains(range.commonAncestorContainer)) return hide();
    var rects = range.getClientRects();
    var rect = rects[rects.length - 1] || range.getBoundingClientRect();
    saved = range.cloneRange();
    button.style.left = Math.max(8, Math.min(rect.right + window.scrollX - 40, document.documentElement.clientWidth - 110)) + "px";
    button.style.top = (rect.bottom + window.scrollY + 8) + "px";
    button.hidden = false;
  });
  button.addEventListener("mousedown", function (e) { e.preventDefault(); });
  button.addEventListener("click", function () {
    if (saved) open({ range: saved });
    hide();
  });
  document.querySelectorAll(".comment-btn").forEach(function (b) {
    b.addEventListener("click", function () {
      open({ element: b.closest(".q") || b.closest("h3") || b });
    });
  });
})();
</script>
