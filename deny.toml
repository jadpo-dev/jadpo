# What `cargo deny check` holds every dependency to (docs/security.md,
# "Supply chain"): known advisories, licences, where crates come from, and
# wildcard versions. The gate runs it (`tools/verify.py`, the `lint` group)
# with `cargo audit`, which reads the same RustSec database.

[graph]
# Every platform a `jadpo` or a deployable is built for, so a crate only
# one of them links is checked too.
targets = [
    "aarch64-apple-darwin",
    "x86_64-apple-darwin",
    "aarch64-unknown-linux-gnu",
    "x86_64-unknown-linux-gnu",
    "x86_64-pc-windows-msvc",
    "wasm32-unknown-unknown",
]
all-features = true

[advisories]
# A yanked crate is refused as an advisory is; each ignored advisory says
# why it doesn't reach Jadpo.
yanked = "deny"
ignore = [
    { id = "RUSTSEC-2023-0071", reason = "rsa's Marvin attack recovers a private key from timing of operations with it; Jadpo only verifies RSA signatures with public keys (jadpo-value: JWT, passkeys, certificates) and holds no RSA private key. No fixed release exists." },
]

[licenses]
# Permissive licences, which an Apache-2.0 project can ship.
allow = [
    "0BSD",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "BSL-1.0",
    "CC0-1.0",
    "CDLA-Permissive-2.0",
    "ISC",
    "MIT",
    "MIT-0",
    "Unicode-3.0",
    "Unlicense",
    "Zlib",
]
confidence-threshold = 0.93
# MPL-2.0 is file-level copyleft: allowed only for Servo's CSS parser and
# its number formatter, which the HTML sanitiser brings and Jadpo uses
# unmodified (Cargo.toml, `ammonia`). Dev-dependencies, such as the MPL-2.0
# `webauthn-rs` the passkey tests hold the runtime to, are not shipped and
# not checked.
exceptions = [
    { allow = ["MPL-2.0"], crate = "cssparser" },
    { allow = ["MPL-2.0"], crate = "dtoa-short" },
]

[licenses.private]
# The workspace's own crates are never published.
ignore = true

[bans]
# Several versions of one crate cost build time, not safety: reported, not
# refused.
multiple-versions = "warn"
# A dependency names a version, never `*`; the workspace's own crates
# depend on each other by path.
wildcards = "deny"
allow-wildcard-paths = true

[sources]
# Crates come from crates.io and nowhere else: no git dependencies and no
# other registry.
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
allow-git = []
