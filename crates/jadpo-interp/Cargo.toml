[package]
name = "jadpo-interp"
description = "The interpreter: runs a checked project's typed bodies on the shared runtime"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true
license.workspace = true
# One integration-test binary: tests/main.rs.
autotests = false

# A compiler crate that links the runtime it shares with compiled code
# (docs/compiler-runtime.md §2.1 and §2.5): the one compiler crate that may.
[dependencies]
jadpo-check.workspace = true
jadpo-db.workspace = true
jadpo-diag.workspace = true
jadpo-graph.workspace = true
jadpo-plan.workspace = true
# The fakes, recordings, crash points and the plan's dev and test
# section (chunk 8.1e), which `jadpo test` and `jadpo dev` run with.
jadpo-runtime = { workspace = true, features = ["testing"] }
jadpo-std.workspace = true
jadpo-value.workspace = true

# The per-type harness reads each standard type's JSON examples
# (tests/standard_types.rs, chunk 5.5w3); the golden files write each
# stored value as SQL text (tests/standard_goldens.rs, chunk 5.9).
[dev-dependencies]
jadpo-sql.workspace = true
serde_json.workspace = true

[lints]
workspace = true

[[test]]
name = "integration"
path = "tests/main.rs"
