[package]
name = "jadpo-test"
description = "The test runner: finds a checked project's tests, runs them in the interpreter and reports each failure as area 13 decides"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true
license.workspace = true
# One integration-test binary: tests/main.rs.
autotests = false

[dependencies]
blake3.workspace = true
jadpo-check.workspace = true
jadpo-db.workspace = true
jadpo-diag.workspace = true
jadpo-drivers.workspace = true
jadpo-graph.workspace = true
# The software authenticator `test_passkeys` drives the passkey routes
# with (area 8; chunk 5.5z2): only tests have it.
jadpo-host-native = { workspace = true, features = ["test-authenticator", "testing"] }
jadpo-interp.workspace = true
# The fakes, recordings, crash points and the plan's dev and test
# section (chunk 8.1e), which `jadpo test` and `jadpo dev` run with.
jadpo-runtime = { workspace = true, features = ["testing"] }
jadpo-term.workspace = true
serde_json.workspace = true

[dev-dependencies]
# PostgreSQL over TLS against servers given a certificate the test makes
# (chunk 8.1n), with jadpo-host-native's test authority.
jadpo-std.workspace = true
rcgen.workspace = true
rustls.workspace = true

[lints]
workspace = true

# One disposable server for a run of the gate (tools/verify.py).
[[bin]]
name = "jadpo-test-server"
test = false

[[test]]
name = "integration"
path = "tests/main.rs"
