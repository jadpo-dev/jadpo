[package]
name = "jadpo-cli"
description = "The jadpo command"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true
license.workspace = true
repository.workspace = true
homepage = "https://github.com/richardwillars/jadpo"
# One integration-test binary: tests/main.rs.
autotests = false

[[bin]]
name = "jadpo"
path = "src/main.rs"

[dependencies]
jadpo-check.workspace = true
# `jadpo build` writes a deployable's Rust and drives cargo over it (chunk
# 8.1o).
jadpo-codegen.workspace = true
# The CLDR data a deployable carries, for its supported locales only
# (chunk 8.2c).
jadpo-cldr.workspace = true
jadpo-db.workspace = true
jadpo-diag.workspace = true
# The SMTP driver's writer, so the dev inbox hands SpamAssassin each mail
# as it would be sent (chunk 7.3c3).
jadpo-drivers = { workspace = true, features = ["smtp"] }
jadpo-fmt.workspace = true
jadpo-graph.workspace = true
# `jadpo dev` serves its fakes in front of the drivers (chunk 8.1e).
jadpo-host-native = { workspace = true, features = ["testing"] }
jadpo-interp.workspace = true
# The fakes, recordings, crash points, the test authenticator and the
# plan's dev and test section (chunk 8.1e), which `jadpo test` and `jadpo
# dev` run with.
jadpo-runtime = { workspace = true, features = ["testing"] }
jadpo-std.workspace = true
jadpo-lsp.workspace = true
jadpo-plan.workspace = true
jadpo-sql.workspace = true
jadpo-syntax.workspace = true
jadpo-term.workspace = true
jadpo-test.workspace = true
jadpo-value.workspace = true
serde_json.workspace = true
sha2.workspace = true
# A Workers deployable's module size gzipped, as Wrangler reports an
# upload's, on `jadpo build`'s screen (chunk 8.2b).
miniz_oxide.workspace = true
# `jadpo suggest share` (area 14, chunk 5.5y): the project token from the
# operating system's generator, and HTTPS to Jadpo HQ through OpenSSL,
# which only the `jadpo` tool links: no deployable does.
getrandom.workspace = true
openssl.workspace = true

# The runtime's source this `jadpo` carries, packed by build.rs (chunk
# 9.2c): deflated and named by its digest, with crates already in the lock.
[build-dependencies]
miniz_oxide.workspace = true
sha2.workspace = true

[dev-dependencies]
# Local OIDC provider TLS fixtures, using the native host's test authority.
rcgen.workspace = true
rustls.workspace = true
# A test's server on this machine standing in for AWS's SNS host.
jadpo-host-native = { workspace = true, features = ["test-outbound"] }
regex.workspace = true
tokio.workspace = true

[lints]
workspace = true

[[test]]
name = "integration"
path = "tests/main.rs"

# The prebuilt `jadpo` each Release carries (docs/documentation.md,
# "Installing"; dist-workspace.toml): this is the one package dist builds,
# with OpenSSL compiled in, so the binary needs no OpenSSL on the machine it
# runs on, and its installers name it `jadpo`.
[package.metadata.dist]
dist = true
features = ["vendored-openssl"]
formula = "jadpo"
npm-package = "jadpo"

[features]
# OpenSSL built from source and linked statically, for the Release builds.
vendored-openssl = ["openssl/vendored"]
