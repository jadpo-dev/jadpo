[package]
name = "jadpo-cli"
description = "The jadpo command"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true
license.workspace = true
# One integration-test binary: tests/main.rs.
autotests = false

[[bin]]
name = "jadpo"
path = "src/main.rs"

[dependencies]
jadpo-check.workspace = true
jadpo-db.workspace = true
jadpo-diag.workspace = true
jadpo-fmt.workspace = true
jadpo-graph.workspace = true
jadpo-host-native.workspace = true
jadpo-interp.workspace = true
jadpo-runtime.workspace = true
jadpo-std.workspace = true
jadpo-lsp.workspace = true
jadpo-plan.workspace = true
jadpo-sql.workspace = true
jadpo-syntax.workspace = true
jadpo-term.workspace = true
jadpo-test.workspace = true
jadpo-value.workspace = true
serde_json.workspace = true
sha2.workspace = true
# `jadpo suggest share` (area 14, chunk 5.5y): the project token from the
# operating system's generator, and HTTPS to Jadpo HQ through the OpenSSL
# `webauthn-rs` already links, so no crate is added.
getrandom.workspace = true
openssl.workspace = true

[dev-dependencies]
jadpo-drivers.workspace = true
# The software authenticator the passkey tests sign in with (area 8).
jadpo-host-native = { workspace = true, features = ["test-authenticator", "test-outbound"] }
regex.workspace = true
tokio.workspace = true

[lints]
workspace = true

[[test]]
name = "integration"
path = "tests/main.rs"
