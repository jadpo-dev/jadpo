[package]
name = "jadpo-runtime"
description = "What a running Jadpo program needs from its context: frames at .jadpo places, failures, faults, outcomes, the action boundary and the capabilities a host gives"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true
license.workspace = true
autotests = false

# A runtime crate (docs/compiler-runtime.md §2.1 and §2.6): it builds for
# wasm32-unknown-unknown and depends only on runtime crates and jadpo-std,
# so a generated application needs nothing else.
[dependencies]
jadpo-std.workspace = true
jadpo-value.workspace = true
# Reads a request's JSON body (area 7).
serde_json.workspace = true
# The digest an idempotency key is stored with, which a repeat must match
# (area 7, "Idempotent writes"); pure Rust, so it builds for wasm32.
blake3.workspace = true
# Unpacks a gzip file a file helper reads given `max_unpacked_size:`
# (chunk 6.4b3); pure Rust, so it builds for wasm32.
miniz_oxide.workspace = true
# The passkey ceremonies (area 8, "Passkeys"; `webauthn`): a device's CBOR
# read with `serde_cbor_2`, the reader `webauthn-rs` reads it with, pure
# Rust, so every host checks an answer alike; the signatures are
# jadpo-value's ES256 and RS256.
serde.workspace = true
serde_cbor_2.workspace = true
# The test authenticator's ES256 keys and signatures (`testing` only):
# RustCrypto's P-256, already jadpo-value's for checking them.
p256 = { workspace = true, optional = true }

[features]
# What only `jadpo test` and `jadpo dev` run (chunk 8.1e): the fakes, the
# recordings, the crash points, the test authenticator and the plan's dev
# and test section. A deployable built without it holds none of them.
testing = ["jadpo-std/testing", "dep:p256"]

# The crate's own tests run with `testing` on.
[dev-dependencies]
jadpo-runtime = { path = ".", features = ["testing"] }
stats_alloc.workspace = true

# The reference the passkey ceremonies are held to (tests/passkeys.rs):
# `webauthn-rs`, which verifies with OpenSSL, and OpenSSL for the keys and
# signatures of answers a device shouldn't give. Natively only, and only
# here: no deployable links either.
[target.'cfg(not(target_arch = "wasm32"))'.dev-dependencies]
webauthn-rs.workspace = true
webauthn-rs-core.workspace = true
openssl.workspace = true

[[test]]
name = "integration"
path = "tests/main.rs"

# Its own binary, with no harness, so its counting allocator sees only
# what routing a request allocates (chunk 8.1k): in a folder, so it is no
# file of the one integration binary's (§2.7).
[[test]]
name = "route_allocations"
path = "tests/route_allocations/main.rs"
harness = false

[lints]
workspace = true
