[package]
name = "jadpo-runtime"
description = "What a running Jadpo program needs from its context: frames at .jadpo places, failures, faults, outcomes, the action boundary and the capabilities a host gives"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true
license.workspace = true
autotests = false

# A runtime crate (docs/compiler-runtime.md §2.1 and §2.6): it builds for
# wasm32-unknown-unknown and depends only on runtime crates and jadpo-std,
# so a generated application needs nothing else.
[dependencies]
jadpo-std.workspace = true
jadpo-value.workspace = true
# Reads a request's JSON body (area 7).
serde_json.workspace = true
# The digest an idempotency key is stored with, which a repeat must match
# (area 7, question 17); pure Rust, so it builds for wasm32.
blake3.workspace = true
# Unpacks a gzip file a file helper reads given `max_unpacked_size:`
# (chunk 6.4b3); pure Rust, so it builds for wasm32.
miniz_oxide.workspace = true

[features]
# What only `jadpo test` and `jadpo dev` run (chunk 8.1e): the fakes, the
# recordings, the crash points and the plan's dev and test section. A
# deployable built without it holds none of them.
testing = ["jadpo-std/testing"]

# The crate's own tests run with `testing` on.
[dev-dependencies]
jadpo-runtime = { path = ".", features = ["testing"] }
stats_alloc.workspace = true

[[test]]
name = "integration"
path = "tests/main.rs"

# Its own binary, with no harness, so its counting allocator sees only
# what routing a request allocates (chunk 8.1k).
[[test]]
name = "route_allocations"
path = "tests/route_allocations.rs"
harness = false

[lints]
workspace = true
