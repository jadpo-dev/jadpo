[package]
name = "jadpo-std"
description = "The standard library's facts shared by the compiler and the runtime: built-in types, value rules and their validators, and the typed operation table"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true
license.workspace = true

# A shared leaf crate (docs/compiler-runtime.md §2.1): it depends on no other
# workspace crate, so compiler and runtime crates may both depend on it, and
# it builds for wasm32-unknown-unknown.
# idna checks a domain name by UTS 46, and spdx holds the SPDX licence list
# (area 19, "Web and software"); ammonia is the HTML sanitiser `Html` is
# built with, over html5ever (area 19, "Text formats"); serde_json writes a
# queue's consumer for the Wrangler file (chunk 7.7c2). serde's traits and
# derives write the runtime's plan in the canonical byte encoding, which
# is jadpo-std's own format on serde's data model (chunk 8.1a); serde and
# serde_derive are already in the lock under serde_json and webauthn-rs.
[dependencies]
regex.workspace = true
serde_json.workspace = true
serde = { workspace = true, features = ["derive"] }
idna.workspace = true
spdx.workspace = true
ammonia.workspace = true
html5ever.workspace = true

[features]
# The runtime plan's dev and test section (chunk 8.1e), which `jadpo test`
# and `jadpo dev` read: a deployable built without it holds none.
testing = []

[lints]
workspace = true
