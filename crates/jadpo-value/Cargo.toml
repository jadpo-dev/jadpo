[package]
name = "jadpo-value"
description = "Runtime values and the standard library's operations, shared by the interpreter and compiled code"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true
license.workspace = true

# A runtime crate (docs/compiler-runtime.md §2.1): it builds for
# wasm32-unknown-unknown and depends on no compiler or tooling crate; only on
# jadpo-std, the leaf crate it shares with the compiler. serde_json reads
# a request's JSON (area 7) and `json.read`'s (area 19); what Jadpo writes
# it writes itself. sha2 is `hash.sha256`'s digest (area 19), and
# chacha20poly1305, argon2, hmac and ed25519-dalek are `crypto`'s (area
# 19, chunk 5.5q2), given their nonces and salts by the host. jiff
# holds the time zone database `temporal` works in (area 10), and the ICU4X
# crates the locale data that formats it for people and the plural rules
# and numbers of a translation's messages (area 10), and the case
# mapping, collation and normalisation `text` uses (area 19), and the
# names of places, languages and scripts and CLDR's person-name patterns
# the scripts names are written in, for the order `text.format` writes a
# person's name in (area 19, "People and contact"). pulldown-cmark renders
# CommonMark for `markup.to_html` (area 19, "Text formats"). serde's
# traits read a token's JSON refusing a member named twice
# (`crypto.verify_jwt`, area 19, chunk 5.5r). subtle compares a secret
# value in constant time (area 19, chunk 5.5r2). x509-parser reads a
# `Certificate`'s DER (area 19, chunk 5.5r5). rsa and p256 check RS256 and
# ES256 tokens' signatures (area 19, chunk 5.5r4). sha1 checks Twilio's and
# AWS SNS's webhook signatures (area 11, chunk 7.7b).
[dependencies]
jadpo-std.workspace = true
jiff.workspace = true
icu_calendar.workspace = true
icu_datetime.workspace = true
icu_decimal.workspace = true
icu_plurals.workspace = true
icu_experimental.workspace = true
icu_locale.workspace = true
icu_time.workspace = true
icu_list.workspace = true
icu_casemap.workspace = true
icu_collator.workspace = true
icu_normalizer.workspace = true
icu_properties.workspace = true
fixed_decimal.workspace = true
icu_provider.workspace = true
writeable.workspace = true
serde_json.workspace = true
serde.workspace = true
sha2.workspace = true
sha1.workspace = true
chacha20poly1305.workspace = true
argon2.workspace = true
hmac.workspace = true
ed25519-dalek.workspace = true
subtle.workspace = true
pulldown-cmark.workspace = true
x509-parser.workspace = true
rsa.workspace = true
p256.workspace = true

[dev-dependencies]
stats_alloc.workspace = true

# An isolated counting allocator, without parallel test-harness allocations.
[[test]]
name = "json_allocations"
path = "tests/json_allocations/main.rs"
harness = false

[lints]
workspace = true
