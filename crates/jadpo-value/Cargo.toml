[package]
name = "jadpo-value"
description = "Runtime values and the standard library's operations, shared by the interpreter and compiled code"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true
license.workspace = true

# A runtime crate (docs/compiler-runtime.md §2.1): it builds for
# wasm32-unknown-unknown and depends on no compiler or tooling crate; only on
# jadpo-std, the leaf crate it shares with the compiler. serde_json reads
# a request's JSON (area 7) and `json.read`'s (area 19); what Jadpo writes
# it writes itself. sha2 is `hash.sha256`'s digest (area 19). jiff
# holds the time zone database `temporal` works in (area 10), and the ICU4X
# crates the locale data that formats it for people and the plural rules
# and numbers of a translation's messages (area 10), and the case
# mapping, collation and normalisation `text` uses (area 19).
[dependencies]
jadpo-std.workspace = true
jiff.workspace = true
icu_calendar.workspace = true
icu_datetime.workspace = true
icu_decimal.workspace = true
icu_plurals.workspace = true
icu_experimental.workspace = true
icu_locale.workspace = true
icu_time.workspace = true
icu_list.workspace = true
icu_casemap.workspace = true
icu_collator.workspace = true
icu_normalizer.workspace = true
icu_properties.workspace = true
fixed_decimal.workspace = true
writeable.workspace = true
serde_json.workspace = true
sha2.workspace = true

[lints]
workspace = true
