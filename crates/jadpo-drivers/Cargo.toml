[package]
name = "jadpo-drivers"
description = "The runtime's capability drivers over a transport the host supplies, and the factory that builds each connection's: PostgreSQL, provider packages and SMTP"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true
license.workspace = true

# A runtime crate (docs/compiler-runtime.md §2.1 and §2.6): it builds for
# wasm32-unknown-unknown, with and without its drivers, and depends only on
# runtime crates. Each driver is a cargo feature, so a deployable links only
# the drivers it reaches.
[features]
default = []
# PostgreSQL over the host's `Transport`, its TLS through the transport's
# upgrade after PostgreSQL's SSL request (chunk 8.1n).
postgres = ["dep:tokio-postgres", "dep:bytes", "tokio/io-util"]
# The package driver (area 11, chunk 7.2c): JSON over HTTP through the
# `Fetch` the host gives; the runtime makes and reads each request.
package = []
# The SMTP driver (area 16, chunk 7.3): a rendered email written as one
# MIME message and handed to its server in an SMTP conversation over the
# host's `Transport` (chunk 8.1b).
smtp = ["dep:jadpo-value", "tokio/io-util"]

[dependencies]
jadpo-runtime.workspace = true
# The plan's connections table, which the factory builds drivers from
# (chunk 8.1d).
jadpo-std.workspace = true
jadpo-value = { workspace = true, optional = true }
tokio.workspace = true
tokio-postgres = { workspace = true, optional = true }
bytes = { workspace = true, optional = true }

# In a browser or a Workers isolate, randomness (for SCRAM's nonce) comes
# from JavaScript.
[target.'cfg(target_arch = "wasm32")'.dependencies]
tokio-postgres = { workspace = true, optional = true, features = ["js"] }

[dev-dependencies]
jadpo-value.workspace = true
# A runtime and pipes, for a scripted server (chunk 8.1n).
tokio = { workspace = true, features = ["rt", "io-util", "time"] }

[lints]
workspace = true
