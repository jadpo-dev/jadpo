[package]
name = "jadpo-host-native"
description = "The native host: a current-thread tokio runtime and the transport the drivers connect through"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true
license.workspace = true

# A runtime crate (docs/compiler-runtime.md §2.1 and §2.6) that never builds
# for wasm32: it is listed in [workspace.metadata.targets] native_only, so
# tools/verify.py leaves it out of the wasm32 build.
[dependencies]
jadpo-runtime.workspace = true
jadpo-std.workspace = true
jadpo-drivers = { workspace = true, features = ["postgres"] }
# `signal`: a server drains on SIGTERM, and on ctrl-c under `jadpo dev`
# (chunk 6.7), which adds signal-hook-registry to the lock.
tokio = { workspace = true, features = ["rt", "net", "sync", "time", "signal"] }
bytes.workspace = true
# HTTP/1.1 (docs/compiler-runtime.md §2.6), pinned exactly: hyper reads and
# writes requests, hyper-util adapts tokio's sockets, http-body-util reads a
# body whole and writes one.
hyper = { workspace = true, features = ["server", "http1"] }
hyper-util = { workspace = true, features = ["tokio"] }
http-body-util.workspace = true
# The operating system's cryptographic generator (area 19, "Randomness").
getrandom.workspace = true
# The passkey ceremonies (area 8, chunk 5.5z), behind the runtime's
# `Passkeys` capability.
webauthn-rs.workspace = true
webauthn-rs-core.workspace = true
serde_cbor_2.workspace = true
serde_json.workspace = true
# A software authenticator for tests (`test-authenticator`): ES256 keys
# and signatures on the OpenSSL `webauthn-rs` already links.
openssl = { workspace = true, optional = true }

[dev-dependencies]
# A test's application builds its codecs (chunk 6.9).
jadpo-value.workspace = true

[features]
test-authenticator = ["dep:openssl"]

[lints]
workspace = true
