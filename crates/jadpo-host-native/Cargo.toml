[package]
name = "jadpo-host-native"
description = "The native host: a current-thread tokio runtime and the transport the drivers connect through"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true
license.workspace = true
autotests = false

# A runtime crate (docs/compiler-runtime.md §2.1 and §2.6) that never builds
# for wasm32: it is listed in [workspace.metadata.targets] native_only, so
# tools/verify.py leaves it out of the wasm32 build.
[dependencies]
jadpo-runtime.workspace = true
jadpo-std.workspace = true
# The values the disk driver is sent and answers (chunk 6.4b).
jadpo-value.workspace = true
jadpo-drivers = { workspace = true, features = ["postgres", "package", "smtp"] }
# `signal`: a server drains on SIGTERM, and on ctrl-c under `jadpo dev`
# (chunk 6.7), which adds signal-hook-registry to the lock.
tokio = { workspace = true, features = ["rt", "net", "sync", "time", "signal"] }
bytes.workspace = true
# HTTP/1.1 (docs/compiler-runtime.md §2.6), pinned exactly: hyper reads and
# writes requests, served and sent (`client`, chunk 8.1m: the package
# driver's calls over kept connections), hyper-util adapts tokio's sockets,
# http-body-util reads a body whole and writes one.
hyper = { workspace = true, features = ["server", "client", "http1"] }
hyper-util = { workspace = true, features = ["tokio"] }
http-body-util.workspace = true
# The operating system's cryptographic generator (area 19, "Randomness").
getrandom.workspace = true
# The passkey ceremonies (area 8, chunk 5.5z), behind the runtime's
# `Passkeys` capability.
webauthn-rs.workspace = true
webauthn-rs-core.workspace = true
serde_cbor_2.workspace = true
serde_json.workspace = true
# A software authenticator's ES256 keys and signatures for tests
# (`test-authenticator`): the OpenSSL `webauthn-rs` already links.
openssl.workspace = true
# TLS for every connection the host makes (chunk 8.1b): a driver's
# stream upgraded (`Transport::upgrade`), and HTTPS for provider calls.
rustls.workspace = true
tokio-rustls.workspace = true
webpki-roots.workspace = true

[[test]]
name = "integration"
path = "tests/main.rs"

[dev-dependencies]
rcgen.workspace = true

[features]
# The runtime's fakes, recordings, crash points and the plan's dev and test
# section (chunk 8.1e), for `jadpo test` and `jadpo dev`: a deployable is
# built without it.
testing = ["jadpo-runtime/testing"]
test-authenticator = []
# A test's server on this machine standing in for AWS's SNS host
# (`fetch::Outward::reaching`, chunk 7.7b): never built outside a test.
test-outbound = []

[lints]
workspace = true
