[workspace]
members = ["crates/*"]
resolver = "3"

# The intended crate graph (docs/compiler-runtime.md §2.1), by layer: read by
# the crate-graph test (crates/jadpo-cli/tests/crate_graph.rs) and by
# tools/verify.py, which builds the shared and runtime crates for wasm32. A
# crate listed before it exists takes its place when it is created.
[workspace.metadata.layers]
shared = ["jadpo-std"]
compiler = [
    "jadpo-diag",
    "jadpo-syntax",
    "jadpo-fmt",
    "jadpo-sql",
    "jadpo-graph",
    "jadpo-db",
    "jadpo-check",
    "jadpo-plan",
    "jadpo-interp",
    "jadpo-codegen",
]
runtime = [
    "jadpo-value",
    "jadpo-runtime",
    "jadpo-drivers",
    "jadpo-host-native",
    "jadpo-host-workers",
]
tooling = ["jadpo-term", "jadpo-test", "jadpo-lsp", "jadpo-cli"]

# Runtime crates that never build for wasm32: tools/verify.py leaves them
# out of its wasm32 build. A crate listed before it exists is skipped.
[workspace.metadata.targets]
native_only = ["jadpo-host-native", "jadpo-host-workers"]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.99"
publish = false
license = "Apache-2.0"

[workspace.dependencies]
jadpo-diag = { path = "crates/jadpo-diag" }
jadpo-term = { path = "crates/jadpo-term" }
jadpo-syntax = { path = "crates/jadpo-syntax" }
jadpo-fmt = { path = "crates/jadpo-fmt" }
jadpo-db = { path = "crates/jadpo-db" }
jadpo-check = { path = "crates/jadpo-check" }
jadpo-value = { path = "crates/jadpo-value" }
jadpo-runtime = { path = "crates/jadpo-runtime" }
jadpo-interp = { path = "crates/jadpo-interp" }
jadpo-plan = { path = "crates/jadpo-plan" }
jadpo-std = { path = "crates/jadpo-std" }
jadpo-graph = { path = "crates/jadpo-graph" }
jadpo-sql = { path = "crates/jadpo-sql" }
jadpo-lsp = { path = "crates/jadpo-lsp" }
jadpo-test = { path = "crates/jadpo-test" }
jadpo-drivers = { path = "crates/jadpo-drivers" }
jadpo-host-native = { path = "crates/jadpo-host-native" }
rowan = "=0.16.1"
ungrammar = "=1.16.1"
serde_json = "1"
# Linear-time regular expressions: `pattern:` settings are checked while
# compiling (area 2, question 9), and the runtime will use the same crate.
regex = "=1.11.1"
# Domain names (area 19, "Web and software", chunk 5.5n; jadpo-std, whose
# validators both the checker and the runtime run): UTS 46's processing of
# IDNA 2008, Servo's crate that rust-url uses, pure Rust and built for
# wasm32. Its back end, `idna_adapter` 1.2, runs on the ICU4X release pinned
# below, so Unicode's data isn't carried twice.
idna = { version = "=1.1.0", default-features = false, features = ["std", "compiled_data"] }
# SPDX licence expressions (area 19, "Web and software", chunk 5.5n2;
# jadpo-std): Embark's crate, Apache-2.0, pure Rust with `smallvec` as its
# one dependency and built for wasm32. Its identifiers are the SPDX
# License List 3.29.0 (CC0 data); `SpdxLicence` reads them by exact
# spelling, and the expression grammar is jadpo-std's own.
spdx = { version = "=0.13.6", default-features = false }
# The HTML sanitiser (area 19, "Text formats", chunk 5.5o; jadpo-std, so
# the checker proves an `Html` literal with the code the runtime builds
# every `Html` value with): ammonia, MIT OR Apache-2.0, an allow-list
# sanitiser over html5ever, the browsers' own parsing algorithm, pure Rust
# and built for wasm32. It brings Servo's `cssparser` (MPL-2.0) for style
# attributes, which Jadpo's policy never allows. html5ever is ammonia's
# own parser, pinned to the release ammonia takes, read directly by
# `markup::plain_text`, which walks the tree the sanitiser keeps.
ammonia = { version = "=4.2.4", default-features = false }
html5ever = { version = "=0.40.1", default-features = false }
# CommonMark for `markup.to_html` (area 19, "Text formats"; jadpo-value
# only): pulldown-cmark, MIT, pure Rust and built for wasm32, with only its
# HTML writer; what it writes is then made safe by the sanitiser above.
pulldown-cmark = { version = "=0.13.4", default-features = false, features = ["html"] }
# Time zones for `temporal` (area 10; jadpo-value only): pure Rust, builds
# for wasm32, the IANA database bundled into the binary (jiff-tzdb, 2026e,
# about 200 KB) rather than read from the platform, and Temporal's rules
# for a local time in a daylight-saving gap or overlap. No default
# features: nothing reads the system clock or the system's zone files.
jiff = { version = "=0.2.38", default-features = false, features = ["std", "tzdb-bundle-always"] }
# Locale data for the text `temporal.format` and `format_relative` give
# (area 10, "Showing dates and times to people"; jadpo-value only): ICU4X,
# pure Rust, with the CLDR data compiled into the binary (CLDR 48.x, the
# release the `Locale` enum was generated from) rather than read from the
# platform, so the interpreter, native deployables and Workers write alike.
# `icu_experimental` is unstable, so every ICU4X crate is pinned exactly
# and moved together; it brings the relative-time words ("3 minutes ago",
# "yesterday"). `fixed_decimal` and `writeable` are the types they speak.
icu_calendar = { version = "=2.3.0", default-features = false, features = ["compiled_data"] }
icu_datetime = { version = "=2.3.0", default-features = false, features = ["compiled_data"] }
# Plural categories and numbers in a translation's messages (area 10,
# "Translations"): the same ICU4X release and CLDR data, already underneath
# `icu_datetime` and `icu_experimental`, now used directly.
icu_decimal = { version = "=2.3.0", default-features = false, features = ["compiled_data"] }
icu_plurals = { version = "=2.3.0", default-features = false, features = ["compiled_data"] }
icu_experimental = { version = "=0.6.0", default-features = false, features = ["compiled_data"] }
icu_locale = { version = "=2.3.1", default-features = false, features = ["compiled_data"] }
icu_time = { version = "=2.3.0", default-features = false, features = ["compiled_data"] }
# A duration's units for people are joined as a list of units (area 19,
# `text.format`).
icu_list = { version = "=2.3.0", default-features = false, features = ["compiled_data"] }
# Text (area 19, "Text"): case mapping with a locale's rules (`İ` in
# Turkish), collation for `list.sort_by`'s `locale:`, and NFC for text
# decoded at a boundary, and NFD and the marks' general category for
# `text.slug`'s accents, from the same
# ICU4X release and its compiled Unicode and CLDR data.
icu_casemap = { version = "=2.3.0", default-features = false, features = ["compiled_data"] }
icu_collator = { version = "=2.3.0", default-features = false, features = ["compiled_data"] }
icu_normalizer = { version = "=2.3.0", default-features = false, features = ["compiled_data"] }
icu_properties = { version = "=2.3.0", default-features = false, features = ["compiled_data"] }
fixed_decimal = { version = "=0.7.2", default-features = false }
# Money for people (area 19, "Money and payments"): a currency's CLDR
# display name ("British Pound") is data `icu_experimental` bakes but reads
# through no formatter, so it is loaded through the provider trait, from
# the same release; units' names are read through it too, without logging
# the sets a name isn't in (`present::names`).
icu_provider = { version = "=2.3.1", default-features = false }
writeable = { version = "=0.6.4", default-features = false }
# SHA-256 for `hash.sha256` (area 19, "Hashing and cryptography";
# jadpo-value only): RustCrypto's, pure Rust on wasm32, already in the
# lock through tokio-postgres's SCRAM. No default features: no `alloc`
# or OIDs are needed for a one-shot digest.
sha2 = { version = "=0.11.1", default-features = false }
# `crypto` (area 19, "Hashing and cryptography", chunk 5.5q2; jadpo-value
# only): RustCrypto's audited, pure-Rust constructions, one per job and no
# algorithm choices: XChaCha20-Poly1305 for `encrypt` and `decrypt`,
# Argon2id with its PHC strings for passwords, HMAC-SHA-256 over the `sha2`
# above, and dalek's Ed25519 for signatures. None reads randomness itself
# (no `getrandom` or `rand_core` features): a nonce and a salt are the
# invocation's random bytes, as `random`'s are, so a test repeats and
# everything builds for wasm32. `zeroize` wipes key material when dropped.
chacha20poly1305 = { version = "=0.11.0", default-features = false, features = ["alloc", "zeroize"] }
argon2 = { version = "=0.6.0", default-features = false, features = ["alloc", "password-hash", "zeroize"] }
hmac = { version = "=0.13.0", default-features = false }
ed25519-dalek = { version = "=3.0.0", default-features = false, features = ["fast", "zeroize"] }
# Pinned exactly and confined to jadpo-db and jadpo-check (docs/compiler-runtime.md §2.4).
salsa = { version = "=0.28.5", default-features = false, features = ["macros", "inventory"] }
# Node digests (docs/compiler-runtime.md §2.3). `pure` keeps the build free of
# C and assembly, so the compiler crates stay buildable for a browser later.
blake3 = { version = "=1.8.7", default-features = false, features = ["std", "pure"] }
# The language server's protocol (jadpo-lsp only): rust-analyzer's own
# transport and the protocol's types.
lsp-server = "=0.10.0"
lsp-types = "=0.97.0"
# The PostgreSQL driver (jadpo-drivers, feature `postgres`) and the native
# host (docs/compiler-runtime.md §2.6). tokio-postgres runs over a stream the
# host supplies, so it needs none of its own runtime; the codecs are
# jadpo-drivers' own, so none of its `with-*` features either. tokio brings
# only its I/O traits here; jadpo-host-native turns on what it runs.
tokio = { version = "=1.53.3", default-features = false }
tokio-postgres = { version = "=0.7.18", default-features = false }
bytes = "=1.12.1"
# The operating system's cryptographic generator for the native host
# (jadpo-host-native only): what a deployable's new identities, tokens and
# `random` values take (area 19, "Randomness"). getrandom 0.4 calls the
# platform's own interface (getrandom(2), getentropy, BCryptGenRandom),
# already in the lock through tokio-postgres. It never builds for wasm32
# here: a Workers host takes the Web Crypto API's, and `jadpo-value` takes
# random bytes only from the host.
getrandom = { version = "=0.4.3", default-features = false }
# HTTP for the native host (jadpo-host-native only; docs/compiler-runtime.md §2.6).
hyper = { version = "=1.12.0", default-features = false }
hyper-util = { version = "=0.1.21", default-features = false }
http-body-util = "=0.1.3"

[workspace.lints.rust]
unsafe_code = "forbid"
missing_debug_implementations = "warn"

[workspace.lints.clippy]
dbg_macro = "deny"
todo = "deny"

# Argon2id at the release's parameters (19 MiB, 2 passes) takes seconds
# unoptimised, and every test that hashes a password runs it, so the
# password and cipher crates are optimised in test builds too; the gate's
# timings are of Jadpo's own code, which stays unoptimised.
[profile.dev.package.argon2]
opt-level = 3

[profile.dev.package.blake2]
opt-level = 3
