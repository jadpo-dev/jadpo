[workspace]
members = ["crates/*"]
resolver = "3"

# The intended crate graph (docs/compiler-runtime.md §2.1), by layer: read by
# the crate-graph test (crates/jadpo-cli/tests/crate_graph.rs) and by
# tools/verify.py, which builds the shared and runtime crates for wasm32. A
# crate listed before it exists takes its place when it is created.
[workspace.metadata.layers]
shared = ["jadpo-std"]
compiler = [
    "jadpo-diag",
    "jadpo-syntax",
    "jadpo-fmt",
    "jadpo-sql",
    "jadpo-graph",
    "jadpo-db",
    "jadpo-check",
    "jadpo-plan",
    "jadpo-interp",
    "jadpo-codegen",
]
runtime = [
    "jadpo-value",
    "jadpo-runtime",
    "jadpo-drivers",
    "jadpo-host-native",
    "jadpo-host-workers",
]
tooling = ["jadpo-term", "jadpo-test", "jadpo-lsp", "jadpo-cldr", "jadpo-cli"]

# Runtime crates that never build for wasm32: tools/verify.py leaves them
# out of its wasm32 build. A crate listed before it exists is skipped.
# jadpo-host-workers is built for wasm32 there, and natively too, where
# its bindings to Workers' JavaScript compile but are never called.
[workspace.metadata.targets]
native_only = ["jadpo-host-native"]

[workspace.package]
version = "0.2.0"
edition = "2024"
rust-version = "1.99"
publish = false
license = "Apache-2.0"
repository = "https://github.com/jadpo-dev/jadpo"

[workspace.dependencies]
jadpo-diag = { path = "crates/jadpo-diag" }
jadpo-term = { path = "crates/jadpo-term" }
jadpo-syntax = { path = "crates/jadpo-syntax" }
jadpo-fmt = { path = "crates/jadpo-fmt" }
jadpo-db = { path = "crates/jadpo-db" }
jadpo-check = { path = "crates/jadpo-check" }
jadpo-value = { path = "crates/jadpo-value" }
jadpo-runtime = { path = "crates/jadpo-runtime" }
jadpo-interp = { path = "crates/jadpo-interp" }
jadpo-plan = { path = "crates/jadpo-plan" }
jadpo-std = { path = "crates/jadpo-std" }
jadpo-graph = { path = "crates/jadpo-graph" }
jadpo-sql = { path = "crates/jadpo-sql" }
jadpo-lsp = { path = "crates/jadpo-lsp" }
jadpo-test = { path = "crates/jadpo-test" }
jadpo-drivers = { path = "crates/jadpo-drivers" }
jadpo-host-native = { path = "crates/jadpo-host-native" }
jadpo-host-workers = { path = "crates/jadpo-host-workers" }
jadpo-codegen = { path = "crates/jadpo-codegen" }
jadpo-cldr = { path = "crates/jadpo-cldr" }
rowan = "=0.16.1"
ungrammar = "=1.16.1"
serde_json = "1"
# serde's traits, for reading a JSON object while refusing a member named
# twice (`crypto.verify_jwt`'s header and claims, area 19, chunk 5.5r;
# jadpo-value only): already in the lock under serde_json.
serde = { version = "=1.0.229", default-features = false, features = ["std"] }
# Linear-time regular expressions: `pattern:` settings are checked while
# compiling (area 2, question 9), and the runtime will use the same crate.
regex = "=1.11.1"
# Domain names (area 19, "Web and software", chunk 5.5n; jadpo-std, whose
# validators both the checker and the runtime run): UTS 46's processing of
# IDNA 2008, Servo's crate that rust-url uses, pure Rust and built for
# wasm32. Its back end, `idna_adapter` 1.2, runs on the ICU4X release pinned
# below, so Unicode's data isn't carried twice.
idna = { version = "=1.1.0", default-features = false, features = ["std", "compiled_data"] }
# SPDX licence expressions (area 19, "Web and software", chunk 5.5n2;
# jadpo-std): Embark's crate, Apache-2.0, pure Rust with `smallvec` as its
# one dependency and built for wasm32. Its identifiers are the SPDX
# License List 3.29.0 (CC0 data); `SpdxLicence` reads them by exact
# spelling, and the expression grammar is jadpo-std's own.
spdx = { version = "=0.13.6", default-features = false }
# The HTML sanitiser (area 19, "Text formats", chunk 5.5o; jadpo-std, so
# the checker proves an `Html` literal with the code the runtime builds
# every `Html` value with): ammonia, MIT OR Apache-2.0, an allow-list
# sanitiser over html5ever, the browsers' own parsing algorithm, pure Rust
# and built for wasm32. It brings Servo's `cssparser` (MPL-2.0) for style
# attributes, which Jadpo's policy never allows. html5ever is ammonia's
# own parser, pinned to the release ammonia takes, read directly by
# `markup::plain_text`, which walks the tree the sanitiser keeps.
ammonia = { version = "=4.2.4", default-features = false }
html5ever = { version = "=0.40.1", default-features = false }
# CommonMark for `markup.to_html` (area 19, "Text formats"; jadpo-value
# only): pulldown-cmark, MIT, pure Rust and built for wasm32, with only its
# HTML writer; what it writes is then made safe by the sanitiser above.
pulldown-cmark = { version = "=0.13.5", default-features = false, features = ["html"] }
# Time zones for `temporal` (area 10; jadpo-value only): pure Rust, builds
# for wasm32, the IANA database bundled into the binary (jiff-tzdb, 2026e,
# about 200 KB) rather than read from the platform, and Temporal's rules
# for a local time in a daylight-saving gap or overlap. No default
# features: nothing reads the system clock or the system's zone files.
jiff = { version = "=0.2.38", default-features = false, features = ["std", "tzdb-bundle-always"] }
# Locale data for the text `temporal.format` and `format_relative` give
# (area 10, "Showing dates and times to people"; jadpo-value only): ICU4X,
# pure Rust, with the CLDR data compiled into the binary (CLDR 48.x, the
# release the `Locale` enum was generated from) rather than read from the
# platform, so the interpreter, native deployables and Workers write alike.
# `icu_experimental` is unstable, so every ICU4X crate is pinned exactly
# and moved together; it brings the relative-time words ("3 minutes ago",
# "yesterday"). `fixed_decimal` and `writeable` are the types they speak.
icu_calendar = { version = "=2.3.0", default-features = false, features = ["compiled_data"] }
icu_datetime = { version = "=2.3.0", default-features = false, features = ["compiled_data"] }
# Plural categories and numbers in a translation's messages (area 10,
# "Translations"): the same ICU4X release and CLDR data, already underneath
# `icu_datetime` and `icu_experimental`, now used directly.
icu_decimal = { version = "=2.3.0", default-features = false, features = ["compiled_data"] }
icu_plurals = { version = "=2.3.0", default-features = false, features = ["compiled_data"] }
icu_experimental = { version = "=0.6.0", default-features = false, features = ["compiled_data"] }
icu_locale = { version = "=2.3.1", default-features = false, features = ["compiled_data"] }
icu_time = { version = "=2.3.0", default-features = false, features = ["compiled_data"] }
# A duration's units for people are joined as a list of units (area 19,
# `text.format`).
icu_list = { version = "=2.3.0", default-features = false, features = ["compiled_data"] }
# Text (area 19, "Text"): case mapping with a locale's rules (`İ` in
# Turkish), collation for `list.sort_by`'s `locale:`, and NFC for text
# decoded at a boundary, and NFD and the marks' general category for
# `text.slug`'s accents, from the same
# ICU4X release and its compiled Unicode and CLDR data.
icu_casemap = { version = "=2.3.0", default-features = false, features = ["compiled_data"] }
icu_collator = { version = "=2.3.0", default-features = false, features = ["compiled_data"] }
icu_normalizer = { version = "=2.3.0", default-features = false, features = ["compiled_data"] }
icu_properties = { version = "=2.3.0", default-features = false, features = ["compiled_data"] }
fixed_decimal = { version = "=0.7.2", default-features = false }
# Money for people (area 19, "Money and payments"): a currency's CLDR
# display name ("British Pound") is data `icu_experimental` bakes but reads
# through no formatter, so it is loaded through the provider trait, from
# the same release; units' names are read through it too, without logging
# the sets a name isn't in (`present::names`).
icu_provider = { version = "=2.3.1", default-features = false }
# The CLDR data a deployable carries (jadpo-cldr only; roadmap chunk 8.2c):
# `jadpo build` bakes it again, from the data compiled into this Jadpo, for
# the application's supported locales, and the deployable's build compiles
# that in place of the full set through ICU4X's `ICU4X_DATA_DIR`. ICU4X's
# own exporter and its baked writer at the release above, without the
# blob and file-system formats or rayon; the data crates are the ones the
# components above already compile in, named so their macros can be
# called; the rest are the crates the baked data names.
icu_provider_export = { version = "=2.3.0", default-features = false, features = ["baked_exporter"] }
icu_calendar_data = { version = "=2.3.0", default-features = false }
icu_casemap_data = { version = "=2.3.0", default-features = false }
icu_collator_data = { version = "=2.3.0", default-features = false }
icu_datetime_data = { version = "=2.3.0", default-features = false }
icu_decimal_data = { version = "=2.3.0", default-features = false }
icu_experimental_data = { version = "=0.6.0", default-features = false }
icu_list_data = { version = "=2.3.0", default-features = false }
icu_locale_data = { version = "=2.3.0", default-features = false }
icu_locale_fallback = { version = "=2.3.0", default-features = false }
icu_locale_fallback_data = { version = "=2.3.0", default-features = false }
icu_normalizer_data = { version = "=2.3.0", default-features = false }
icu_plurals_data = { version = "=2.3.0", default-features = false }
icu_properties_data = { version = "=2.3.0", default-features = false }
icu_time_data = { version = "=2.3.1", default-features = false }
icu_collections = { version = "=2.3.0", default-features = false }
icu_locale_core = { version = "=2.3.0", default-features = false }
icu_pattern = { version = "=0.5.0", default-features = false }
zerotrie = { version = "=0.2.5", default-features = false }
zerovec = { version = "=0.11.8", default-features = false }
writeable = { version = "=0.6.4", default-features = false }
# SHA-256 for `hash.sha256` (area 19, "Hashing and cryptography";
# jadpo-value only): RustCrypto's, pure Rust on wasm32, already in the
# lock through tokio-postgres's SCRAM. No default features: no `alloc`
# or OIDs are needed for a one-shot digest.
sha2 = { version = "=0.11.1", default-features = false }
# SHA-1 for the webhook checks that still sign with it (area 11,
# "Receiving from outside"; chunk 7.7b; jadpo-value only): Twilio's
# HMAC-SHA1 and AWS SNS's first signature version. RustCrypto's, the
# release beside the `sha2` above, over the same `digest`; never used to
# hash anything Jadpo itself keeps. No default features: no OIDs.
sha1 = { version = "=0.11.0", default-features = false }
# `crypto` (area 19, "Hashing and cryptography", chunk 5.5q2; jadpo-value
# only): RustCrypto's audited, pure-Rust constructions, one per job and no
# algorithm choices: XChaCha20-Poly1305 for `encrypt` and `decrypt`,
# Argon2id with its PHC strings for passwords, HMAC-SHA-256 over the `sha2`
# above, and dalek's Ed25519 for signatures. None reads randomness itself
# (no `getrandom` or `rand_core` features): a nonce and a salt are the
# invocation's random bytes, as `random`'s are, so a test repeats and
# everything builds for wasm32. `zeroize` wipes the crates' own copies of
# a key when dropped.
chacha20poly1305 = { version = "=0.11.0", default-features = false, features = ["alloc", "zeroize"] }
argon2 = { version = "=0.6.0", default-features = false, features = ["alloc", "password-hash", "zeroize"] }
hmac = { version = "=0.13.0", default-features = false }
ed25519-dalek = { version = "=3.0.0", default-features = false, features = ["fast", "zeroize"] }
# Constant-time comparison for the secret values (area 19, chunk 5.5r2;
# jadpo-value only): dalek's `subtle`, already in the lock through every
# crate above, whose comparisons pass through an optimisation barrier so
# the compiler can't turn them back into an early exit.
subtle = { version = "=2.6.1", default-features = false }
# X.509 certificates for `Certificate` (area 19, chunk 5.5r5; jadpo-value
# only): Rusticata's `x509-parser`, MIT or Apache-2.0, pure Rust over
# `nom` and `der-parser`, fuzzed and written to be panic-free, already in
# the lock through `webauthn-rs-core`, so no crate is added. No `verify`
# feature (`ring`): a certificate is read, never checked against a chain,
# and it builds for wasm32.
x509-parser = { version = "=0.16.0", default-features = false }
# RS256 and ES256 for `crypto.verify_jwt` (area 19, chunk 5.5r4) and the
# passkey ceremonies (area 8): RustCrypto's `rsa`, its latest stable
# release, and `p256`, in jadpo-value to verify. Neither hashes for us: the
# signed input is hashed once with the `sha2` above and checked as a
# prehash, so `rsa`'s older `digest` isn't used. No default features: no
# `std`, so no `getrandom`, and both build for wasm32. jadpo-runtime's
# `testing` signs with `p256` for the test authenticator, its nonces
# RFC 6979's, so it needs no generator either. RUSTSEC-2023-0071 (Marvin), open
# against every `rsa` release, leaks a private key through the timing of
# decryption and signing; verifying holds no private key, so it is not
# reached.
rsa = { version = "=0.9.10", default-features = false }
p256 = { version = "=0.14.0", default-features = false, features = ["ecdsa"] }
# gzip for the file helpers' reads given `max_unpacked_size:` (area 12,
# "Batches: work over many items"; jadpo-runtime, and jadpo-cli for a
# Workers module's size gzipped): miniz_oxide's
# streaming inflate, MIT OR Zlib OR Apache-2.0, pure Rust with `adler2` as
# its one dependency and built for wasm32, unpacking a window at a time so
# a run never holds more than it reads. The gzip members around the
# deflate data (RFC 1952) and their CRC-32 are jadpo-runtime's own.
miniz_oxide = { version = "=0.9.1", default-features = false, features = ["with-alloc"] }
# The code generator (jadpo-codegen only; docs/compiler-runtime.md §2.5,
# "Compiled code"; chunk 8.1f): Rust built with `quote!` as tokens, parsed
# into `syn`'s syntax tree, so output that doesn't parse is the generator's
# error rather than rustc's, and printed with dtolnay's prettyplease, which
# never fails to format and is about twenty times faster than rustfmt. syn
# 3 is already in the lock under async-trait; no defaults, so nothing
# links the compiler's own `proc_macro`.
proc-macro2 = { version = "=1.0.107", default-features = false }
quote = { version = "=1.0.47", default-features = false }
syn = { version = "=3.0.9", default-features = false, features = ["full", "parsing", "printing"] }
prettyplease = { version = "=0.3.0", default-features = false }
# Pinned exactly and confined to jadpo-db and jadpo-check (docs/compiler-runtime.md §2.4).
salsa = { version = "=0.28.5", default-features = false, features = ["macros", "inventory"] }
# Node digests (docs/compiler-runtime.md §2.3). `pure` keeps the build free of
# C and assembly, so the compiler crates stay buildable for a browser later.
blake3 = { version = "=1.8.7", default-features = false, features = ["std", "pure"] }
# The language server's protocol (jadpo-lsp only): rust-analyzer's own
# transport and the protocol's types.
lsp-server = "=0.10.0"
lsp-types = "=0.97.0"
# The PostgreSQL driver (jadpo-drivers, feature `postgres`) and the native
# host (docs/compiler-runtime.md §2.6). tokio-postgres runs over a stream the
# host supplies, so it needs none of its own runtime; the codecs are
# jadpo-drivers' own, so none of its `with-*` features either. tokio brings
# only its I/O traits here; jadpo-host-native turns on what it runs.
tokio = { version = "=1.53.3", default-features = false }
tokio-postgres = { version = "=0.7.18", default-features = false }
bytes = "=1.12.1"
# The operating system's cryptographic generator for the native host
# (jadpo-host-native only): what a deployable's new identities, tokens and
# `random` values take (area 19, "Randomness"). getrandom 0.4 calls the
# platform's own interface (getrandom(2), getentropy, BCryptGenRandom),
# already in the lock through tokio-postgres. It never builds for wasm32
# here: a Workers host takes the Web Crypto API's, and `jadpo-value` takes
# random bytes only from the host.
getrandom = { version = "=0.4.3", default-features = false }
# The reference the passkey ceremonies are held to (area 8, "Passkeys";
# jadpo-runtime's tests only, a dev-dependency): Kanidm's `webauthn-rs`,
# MPL-2.0, unmodified. It verifies with OpenSSL, so no deployable links
# it: the ceremonies every host runs are jadpo-runtime's own, in pure
# Rust, and its tests run each one on both. No attestation
# (`default-features = false`); `conditional-ui` signs in with a
# discoverable credential; `danger-allow-state-serialisation` keeps a
# ceremony's state as the runtime keeps it, as JSON; and
# `danger-credential-internals` loads a stored `WebAuthnCredential` part by
# part, whose types `webauthn-rs-core` names.
webauthn-rs = { version = "=0.5.5", default-features = false, features = ["conditional-ui", "danger-allow-state-serialisation", "danger-credential-internals"] }
webauthn-rs-core = { version = "=0.5.5", default-features = false }
# A device's CBOR and a passkey's COSE key (jadpo-runtime's passkey
# ceremonies): pure Rust, the reader `webauthn-rs` reads them with, so the
# runtime reads an answer as its reference does.
serde_cbor_2 = { version = "=0.13.0", default-features = false, features = ["std"] }
# OpenSSL's bindings, for the `jadpo` tool only: HTTPS to Jadpo HQ
# (jadpo-cli), and the keys and signatures of answers a device shouldn't
# give in the passkey tests, beside `webauthn-rs`. No deployable links it.
openssl = { version = "=0.10.81", default-features = false }
# The GitHub artifact attestation a release's archive carries, checked
# before the toolchain launcher runs a `jadpo` it fetched (area 14, "Which
# jadpo runs"; jadpo-cli only): the Sigstore project's own Rust verifier,
# Apache-2.0 and pure Rust, which checks the bundle's certificate against
# Fulcio, its transparency-log entry, its DSSE signature and that the
# statement names the archive's digest, against the public-good trusted
# root it carries. No default features: no TUF client, HTTP client or
# Tokio, and no `aws-lc-rs`; its cryptography is the RustCrypto crates
# above through a provider of jadpo-cli's own, with `p384` for Fulcio's
# P-384 certificates, from the same release as `p256`.
sigstore-verify = { version = "=0.15.1", default-features = false }
sigstore-trust-root = { version = "=0.15.1", default-features = false }
sigstore-crypto = { version = "=0.15.1", default-features = false }
sigstore-types = { version = "=0.15.1", default-features = false }
p384 = { version = "=0.14.0", default-features = false, features = ["ecdsa"] }
# TLS for the native host (jadpo-host-native only; chunk 8.1b): the one
# stack every connection a deployable makes is secured with, rustls, so no
# OpenSSL on the request path. `ring` is its cryptography: built with only
# a C compiler, where aws-lc-rs wants a much larger C build for the
# post-quantum key exchange it would add, which one provider value can
# switch on later. No `logging`. `tokio-rustls` turns a driver's stream
# into TLS (`Transport::upgrade`). The roots are Mozilla's, compiled in
# (`webpki-roots`, CDLA-Permissive-2.0), not the platform's verifier: a
# deployable checks a server the same way on every machine, a container
# image with no CA bundle included, and a test can't pass because of what
# a developer's keychain trusts.
rustls = { version = "=0.23.46", default-features = false, features = ["ring", "std", "tls12"] }
tokio-rustls = { version = "=0.26.6", default-features = false, features = ["ring", "tls12"] }
webpki-roots = { version = "=1.0.10", default-features = false }
# Counts a test binary's allocations (jadpo-runtime's route-allocation test
# only, chunk 8.1k): the system allocator behind atomic counters, MIT, no
# dependencies. The workspace forbids `unsafe`, which a global allocator
# of our own would need.
stats_alloc = "=0.1.10"
# A test's own certificates (jadpo-host-native's tests only): an authority
# and a server's certificate it signs, made as the test runs.
rcgen = { version = "=0.14.10", default-features = false, features = ["crypto", "ring"] }
# HTTP for the native host (jadpo-host-native only; docs/compiler-runtime.md §2.6).
hyper = { version = "=1.12.0", default-features = false }
hyper-util = { version = "=0.1.21", default-features = false }
http-body-util = "=0.1.3"
# The Workers host (jadpo-host-workers only; docs/compiler-runtime.md §2.6,
# "The Workers host", chunk 8.2a): wasm-bindgen and the JavaScript and Web
# APIs it binds, at the releases tokio-postgres's `js` feature already
# brought into the lock, with wasm-bindgen-futures to await a promise and
# hand a future back as one. Jadpo binds Workers' own APIs (`connect()`,
# `ctx.waitUntil`) itself rather than through workers-rs.
wasm-bindgen = { version = "=0.2.129", default-features = false, features = ["std"] }
js-sys = { version = "=0.3.106", default-features = false, features = ["std"] }
web-sys = { version = "=0.3.106", default-features = false, features = ["std"] }
wasm-bindgen-futures = { version = "=0.4.79", default-features = false, features = ["std"] }
# wasm-bindgen's own library, which turns a module wasm-bindgen's macros
# marked into the module and its JavaScript (the Workers host's tests, and
# `jadpo build` for Workers from chunk 8.2b): at exactly the release of the
# `wasm-bindgen` above, as it requires, so nothing is downloaded and no
# command-line tool has to match it.
wasm-bindgen-cli-support = { version = "=0.2.129", default-features = false }

[workspace.lints.rust]
unsafe_code = "forbid"
missing_debug_implementations = "warn"

[workspace.lints.clippy]
dbg_macro = "deny"
todo = "deny"

# Argon2id at the release's parameters (19 MiB, 2 passes) takes seconds
# unoptimised, and every test that hashes a password runs it, so the
# password and cipher crates are optimised in test builds too; the gate's
# timings are of Jadpo's own code, which stays unoptimised.
[profile.dev.package.argon2]
opt-level = 3

[profile.dev.package.blake2]
opt-level = 3

# A Workers deployable's module is bound by wasm-bindgen's library and its
# size gzipped every time a test builds one (chunk 8.4g): unoptimised,
# binding example 23's kiosk took 2.8 s and gzipping it 1.7 s, optimised
# 0.8 s and 0.3 s, so those crates are optimised in test builds too.
[profile.dev.package.walrus]
opt-level = 3

[profile.dev.package.wasm-bindgen-cli-support]
opt-level = 3

[profile.dev.package.wasmparser]
opt-level = 3

[profile.dev.package.wasm-encoder]
opt-level = 3

[profile.dev.package.miniz_oxide]
opt-level = 3

# The prebuilt `jadpo` each release carries (dist-workspace.toml): an
# optimised build, with thin link-time optimisation.
[profile.dist]
inherits = "release"
lto = "thin"
