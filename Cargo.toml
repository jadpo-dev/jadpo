[workspace]
members = ["crates/*"]
resolver = "3"

# The intended crate graph (docs/compiler-runtime.md §2.1), by layer: read by
# the crate-graph test (crates/jadpo-cli/tests/crate_graph.rs) and by
# tools/verify.py, which builds the shared and runtime crates for wasm32. A
# crate listed before it exists takes its place when it is created.
[workspace.metadata.layers]
shared = ["jadpo-std"]
compiler = [
    "jadpo-diag",
    "jadpo-syntax",
    "jadpo-fmt",
    "jadpo-sql",
    "jadpo-graph",
    "jadpo-db",
    "jadpo-check",
    "jadpo-plan",
    "jadpo-interp",
    "jadpo-codegen",
]
runtime = [
    "jadpo-value",
    "jadpo-runtime",
    "jadpo-drivers",
    "jadpo-host-native",
    "jadpo-host-workers",
]
tooling = ["jadpo-term", "jadpo-test", "jadpo-lsp", "jadpo-cli"]

# Runtime crates that never build for wasm32: tools/verify.py leaves them
# out of its wasm32 build. A crate listed before it exists is skipped.
[workspace.metadata.targets]
native_only = ["jadpo-host-native", "jadpo-host-workers"]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.99"
publish = false
license = "Apache-2.0"

[workspace.dependencies]
jadpo-diag = { path = "crates/jadpo-diag" }
jadpo-term = { path = "crates/jadpo-term" }
jadpo-syntax = { path = "crates/jadpo-syntax" }
jadpo-fmt = { path = "crates/jadpo-fmt" }
jadpo-db = { path = "crates/jadpo-db" }
jadpo-check = { path = "crates/jadpo-check" }
jadpo-value = { path = "crates/jadpo-value" }
jadpo-runtime = { path = "crates/jadpo-runtime" }
jadpo-interp = { path = "crates/jadpo-interp" }
jadpo-plan = { path = "crates/jadpo-plan" }
jadpo-std = { path = "crates/jadpo-std" }
jadpo-graph = { path = "crates/jadpo-graph" }
jadpo-sql = { path = "crates/jadpo-sql" }
jadpo-lsp = { path = "crates/jadpo-lsp" }
jadpo-test = { path = "crates/jadpo-test" }
jadpo-drivers = { path = "crates/jadpo-drivers" }
jadpo-host-native = { path = "crates/jadpo-host-native" }
rowan = "=0.16.1"
ungrammar = "=1.16.1"
serde_json = "1"
# Linear-time regular expressions: `pattern:` settings are checked while
# compiling (area 2, question 9), and the runtime will use the same crate.
regex = "=1.11.1"
# Time zones for `temporal` (area 10; jadpo-value only): pure Rust, builds
# for wasm32, the IANA database bundled into the binary (jiff-tzdb, 2026e,
# about 200 KB) rather than read from the platform, and Temporal's rules
# for a local time in a daylight-saving gap or overlap. No default
# features: nothing reads the system clock or the system's zone files.
jiff = { version = "=0.2.38", default-features = false, features = ["std", "tzdb-bundle-always"] }
# Locale data for the text `temporal.format` and `format_relative` give
# (area 10, "Showing dates and times to people"; jadpo-value only): ICU4X,
# pure Rust, with the CLDR data compiled into the binary (CLDR 48.x, the
# release the `Locale` enum was generated from) rather than read from the
# platform, so the interpreter, native deployables and Workers write alike.
# `icu_experimental` is unstable, so every ICU4X crate is pinned exactly
# and moved together; it brings the relative-time words ("3 minutes ago",
# "yesterday"). `fixed_decimal` and `writeable` are the types they speak.
icu_calendar = { version = "=2.3.0", default-features = false, features = ["compiled_data"] }
icu_datetime = { version = "=2.3.0", default-features = false, features = ["compiled_data"] }
# Plural categories and numbers in a translation's messages (area 10,
# "Translations"): the same ICU4X release and CLDR data, already underneath
# `icu_datetime` and `icu_experimental`, now used directly.
icu_decimal = { version = "=2.3.0", default-features = false, features = ["compiled_data"] }
icu_plurals = { version = "=2.3.0", default-features = false, features = ["compiled_data"] }
icu_experimental = { version = "=0.6.0", default-features = false, features = ["compiled_data"] }
icu_locale = { version = "=2.3.1", default-features = false, features = ["compiled_data"] }
icu_time = { version = "=2.3.0", default-features = false, features = ["compiled_data"] }
fixed_decimal = { version = "=0.7.2", default-features = false }
writeable = { version = "=0.6.4", default-features = false }
# Pinned exactly and confined to jadpo-db and jadpo-check (docs/compiler-runtime.md §2.4).
salsa = { version = "=0.28.5", default-features = false, features = ["macros", "inventory"] }
# Node digests (docs/compiler-runtime.md §2.3). `pure` keeps the build free of
# C and assembly, so the compiler crates stay buildable for a browser later.
blake3 = { version = "=1.8.7", default-features = false, features = ["std", "pure"] }
# The language server's protocol (jadpo-lsp only): rust-analyzer's own
# transport and the protocol's types.
lsp-server = "=0.10.0"
lsp-types = "=0.97.0"
# The PostgreSQL driver (jadpo-drivers, feature `postgres`) and the native
# host (docs/compiler-runtime.md §2.6). tokio-postgres runs over a stream the
# host supplies, so it needs none of its own runtime; the codecs are
# jadpo-drivers' own, so none of its `with-*` features either. tokio brings
# only its I/O traits here; jadpo-host-native turns on what it runs.
tokio = { version = "=1.53.3", default-features = false }
tokio-postgres = { version = "=0.7.18", default-features = false }
bytes = "=1.12.1"
# HTTP for the native host (jadpo-host-native only; docs/compiler-runtime.md §2.6).
hyper = { version = "=1.12.0", default-features = false }
hyper-util = { version = "=0.1.21", default-features = false }
http-body-util = "=0.1.3"

[workspace.lints.rust]
unsafe_code = "forbid"
missing_debug_implementations = "warn"

[workspace.lints.clippy]
dbg_macro = "deny"
todo = "deny"
