[workspace]
members = ["crates/*"]
resolver = "3"

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.99"
publish = false

[workspace.dependencies]
jadpo-diag = { path = "crates/jadpo-diag" }
jadpo-term = { path = "crates/jadpo-term" }
jadpo-syntax = { path = "crates/jadpo-syntax" }
jadpo-fmt = { path = "crates/jadpo-fmt" }
jadpo-db = { path = "crates/jadpo-db" }
jadpo-check = { path = "crates/jadpo-check" }
rowan = "=0.16.1"
ungrammar = "=1.16.1"
serde_json = "1"
# Pinned exactly and confined to jadpo-db and jadpo-check (docs/compiler-runtime.md §2.4).
salsa = { version = "=0.28.5", default-features = false, features = ["macros", "inventory"] }

[workspace.lints.rust]
unsafe_code = "forbid"
missing_debug_implementations = "warn"

[workspace.lints.clippy]
dbg_macro = "deny"
todo = "deny"
