# A topic whose first sentence doesn't say what it is, or runs too long for a row.
[topic_summary]
email = "Emails as typed values: templates the compiler checks, sent after your action commits, caught in tests and in a dev inbox."
files = "A `File` field on a record, with the bytes kept in a store of files."
caches = "Copies of records and query results kept in Redis, so busy pages read them quickly."
feature-flags = "A feature flag lets you ship code switched off, then turn it on for some users, a share of users, or everyone, without a deploy."
rate-limits = "A rate limit caps how many requests a caller may make in a period."
search = "Give an entity a `search:` section and people can search its records by words."
audit-trail = "An entity's history of changes: who made each, when, and what it changed, kept when you ask for it."
the-root = "The files and folders a project's root may hold, and nothing else."
database = "The identity registry in `database/`, and the `.jadpo_record` files the compiler writes and you commit."
personal-data-checks = "What the compiler refuses about personal data, such as a marked field nothing reads."
building-a-type-from-other-types = "Most object types are slices of an entity or of another object, so you build them from it rather than repeat its fields."
logic = "How you write what your app does: functions and actions, statements, operators, `match`, `attempt`, loops and generic code."
reads-and-writes = "How a program reads and changes stored records: queries, filters, totals, related records, refused writes and all-or-nothing actions."
personal-data = "Your app says which data is about a person, and Jadpo exports it, erases it and deletes it when its time is up."
personal-data-export = "`User.export(user_id)` returns everything held about a person, as JSON, one list per entity."
geospatial = "Geospatial values say where things are, and what is near or inside what, such as the shops within five kilometres of a customer."
predicates-and-shapes = "Whether one shape contains, is within or intersects another, and a shape's centre and bounding box."
geospatial-queries = "You find records by where they are with a `geo.` call as a query's `where:` condition."
background-work-and-tenants = "In an app with a `tenant:`, each kind of background work reaches a stated set of tenants."
flags-declared-read-and-tested = "How a flag is declared, how your code reads it, and how a test sets it."
flags-changed-listed-and-removed = "How `jadpo flags` changes and lists a flag's value, and how a flag is removed from the code."
calling = "Your app reaches an outside service through a connection, a named entry under `connections:` in `app.jadpo` that says which package to use."
how-the-openapi-importer-reads-a-document = "What `jadpo package import openapi <file>` reads from a provider's OpenAPI document, what it writes, and what it leaves for you."
shape-and-name-detection = "How the importer turns a provider's fields into standard types, by their shape and their names."
how-the-surface-and-the-publishing-bar-work = "What a package's surface record holds, how its version is worked out, and what `jadpo package check` and `jadpo package show` do."
package-actions-and-recipes = "What a package action may call, how the app calls one, and how `jadpo package recipe` copies a recipe into your project."
recordings = "A recording is a provider's answer to one operation with its plain values replaced by placeholders, so its decoding can be checked without calling the provider."
review-and-sign-off = "The changes a person must accept before they ship, such as one that can break an API client or drop something from the database."
