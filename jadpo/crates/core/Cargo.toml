[package]
name = "jadpo-core"
description = "Compiler and artifact generation core for Jadpo"
documentation.workspace = true
edition.workspace = true
homepage.workspace = true
license.workspace = true
rust-version.workspace = true
version.workspace = true

[dependencies]
jadpo-diagnostics = { path = "../diagnostics" }
jadpo-semantic = { path = "../semantic" }
jadpo-syntax = { path = "../syntax" }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
sha2 = "0.10"

[build-dependencies]
serde_json = "1.0"
sha2 = "0.10"

[lib]
path = "src/lib.rs"
