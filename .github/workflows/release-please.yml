name: Release Please

# Releases (docs/documentation.md, "Versions and releases"). Each push to
# main updates release-please's pull request, which holds the next version
# and its notes, read from the Conventional Commit types since the last
# release (release-please-config.json). Merging that pull request makes a
# draft GitHub Release tagged vX.Y.Z, with the notes; this workflow then
# attaches the docs bundle and starts release.yml, dist's, which builds the
# installers for the tag, attaches them and publishes the release, and
# vscode-extension.yml, which packages the VS Code extension at the same
# version and publishes it once the release is out.
#
# Switched off until the repository variable JADPO_RELEASES is `on`, which
# needs the RELEASE_PLEASE_TOKEN secret first: a pull request opened with
# the workflow's own token runs no CI, so its required check never passes.

on:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: release-please
  cancel-in-progress: false

jobs:
  release-please:
    if: vars.JADPO_RELEASES == 'on'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write
      pull-requests: write
      issues: write
    outputs:
      created: ${{ steps.release.outputs.release_created }}
      tag: ${{ steps.release.outputs.tag_name }}
    steps:
      - id: release
        uses: googleapis/release-please-action@45996ed1f6d02564a971a2fa1b5860e934307cf7 # v5.0.0
        with:
          token: ${{ secrets.RELEASE_PLEASE_TOKEN }}
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json
      # release-please writes the version into Cargo.toml and package.json
      # alone, so on its own the release pull request's Cargo.lock is a
      # version behind and every `--locked` job fails. tools/release/
      # versions.py brings the files that repeat the version into step on
      # the pull request's branch, as the `release` job of validation.yml
      # rehearses on every pull request, and pushes them with
      # RELEASE_PLEASE_TOKEN, so CI runs on the result. It runs on every
      # push while the pull request is open, since release-please rewrites
      # the branch each time, and does nothing when the files are in step.
      - id: pull-request
        name: Find the release pull request
        if: steps.release.outputs.release_created != 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          branch="$(gh pr list --repo "$GITHUB_REPOSITORY" --state open --label 'autorelease: pending' \
            --json headRefName --jq '.[0].headRefName // empty')"
          echo "branch=$branch" >> "$GITHUB_OUTPUT"
      - if: steps.pull-request.outputs.branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ steps.pull-request.outputs.branch }}
          persist-credentials: false
      - if: steps.pull-request.outputs.branch
        name: Install the pinned Rust toolchain
        run: |
          channel="$(sed -n 's/^channel = "\(.*\)"$/\1/p' rust-toolchain.toml)"
          rustup toolchain install "$channel" --profile minimal
      - if: steps.pull-request.outputs.branch
        name: Bring the lock files to the release's version
        env:
          BRANCH: ${{ steps.pull-request.outputs.branch }}
          TOKEN: ${{ secrets.RELEASE_PLEASE_TOKEN }}
        run: |
          python3 tools/release/versions.py
          if git diff --quiet; then
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit --quiet --all --message 'chore: bring the lock files to the release'"'"'s version'
          # The token reaches git for this push alone, never the checkout.
          auth="$(printf 'x-access-token:%s' "$TOKEN" | base64 -w0)"
          echo "::add-mask::$auth"
          git -c "http.https://github.com/.extraheader=AUTHORIZATION: basic $auth" \
            push origin "HEAD:refs/heads/$BRANCH"

  # The docs bundle of the tagged commit, attached to its release while it
  # is still a draft (docs/documentation.md, "The bundle").
  bundle:
    needs: release-please
    if: needs.release-please.outputs.created == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: write
    env:
      TAG: ${{ needs.release-please.outputs.tag }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.release-please.outputs.tag }}
          persist-credentials: false
      - name: Install the pinned Rust toolchain
        run: |
          channel="$(sed -n 's/^channel = "\(.*\)"$/\1/p' rust-toolchain.toml)"
          rustup toolchain install "$channel" --profile minimal
      - name: Build the docs bundle
        run: python3 tools/docs/language_docs.py --bundle build/docs-bundle
      - name: Attach it to the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tar -C build -czf docs-bundle.tar.gz docs-bundle
          gh release upload "$TAG" docs-bundle.tar.gz --clobber --repo "$GITHUB_REPOSITORY"

  # dist's workflow, started by hand for the tag: a tag the workflow's own
  # token pushed starts no workflow, but a dispatch does.
  installers:
    needs: [release-please, bundle]
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      actions: write
    env:
      TAG: ${{ needs.release-please.outputs.tag }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: Build the installers for the tag
        run: gh workflow run release.yml --repo "$GITHUB_REPOSITORY" --ref "$TAG" -f tag="$TAG"

  # The VS Code extension at the release's version, started as dist's is.
  extension:
    needs: [release-please, installers]
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      actions: write
    env:
      TAG: ${{ needs.release-please.outputs.tag }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: Package and publish the extension for the tag
        run: gh workflow run vscode-extension.yml --repo "$GITHUB_REPOSITORY" --ref "$TAG" -f tag="$TAG"
