name: Release Please

# Releases (docs/documentation.md, "Versions and releases"). Each push to
# main updates release-please's pull request, which holds the next version
# and its notes, read from the Conventional Commit types since the last
# release (release-please-config.json). Merging that pull request makes a
# draft GitHub Release tagged vX.Y.Z, with the notes; this workflow then
# attaches the docs bundle and starts release.yml, dist's, which builds the
# installers for the tag, attaches them and publishes the release.
#
# Switched off until the repository variable JADPO_RELEASES is `on`, which
# needs the RELEASE_PLEASE_TOKEN secret first: a pull request opened with
# the workflow's own token runs no CI, so its required check never passes.

on:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: release-please
  cancel-in-progress: false

jobs:
  release-please:
    if: vars.JADPO_RELEASES == 'on'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write
      pull-requests: write
      issues: write
    outputs:
      created: ${{ steps.release.outputs.release_created }}
      tag: ${{ steps.release.outputs.tag_name }}
    steps:
      - id: release
        uses: googleapis/release-please-action@45996ed1f6d02564a971a2fa1b5860e934307cf7 # v5.0.0
        with:
          token: ${{ secrets.RELEASE_PLEASE_TOKEN }}
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json

  # The docs bundle of the tagged commit, attached to its release while it
  # is still a draft (docs/documentation.md, "The bundle").
  bundle:
    needs: release-please
    if: needs.release-please.outputs.created == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: write
    env:
      TAG: ${{ needs.release-please.outputs.tag }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ needs.release-please.outputs.tag }}
          persist-credentials: false
      - name: Install the pinned Rust toolchain
        run: |
          channel="$(sed -n 's/^channel = "\(.*\)"$/\1/p' rust-toolchain.toml)"
          rustup toolchain install "$channel" --profile minimal
      - name: Build the docs bundle
        run: python3 tools/docs/language_docs.py --bundle build/docs-bundle
      - name: Attach it to the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tar -C build -czf docs-bundle.tar.gz docs-bundle
          gh release upload "$TAG" docs-bundle.tar.gz --clobber --repo "$GITHUB_REPOSITORY"

  # dist's workflow, started by hand for the tag: a tag the workflow's own
  # token pushed starts no workflow, but a dispatch does.
  installers:
    needs: [release-please, bundle]
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      actions: write
    env:
      TAG: ${{ needs.release-please.outputs.tag }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: Build the installers for the tag
        run: gh workflow run release.yml --repo "$GITHUB_REPOSITORY" --ref "$TAG" -f tag="$TAG"
