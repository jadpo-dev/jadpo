name: Verifier image

# The verifier's container image (docs/language/11-integrations.md, "The
# verifier"; deploy/verifier/Dockerfile), on each Release: the Release's own
# `jadpo` for Linux, checked against its attestation, in the image, which is
# then started and used before anything is published. release-please.yml
# starts it for each release it makes; it can also be run by hand for a tag.
# A pull request that touches it builds its own `jadpo` and tests the image
# the same way, publishing nothing.
#
# Publishing runs while the repository variable JADPO_VERIFIER_IMAGE is `on`.
# It is off until a maintainer sets it (docs/documentation.md, "Versions and
# releases"), and pushes to GitHub's container registry with the workflow's
# own token, so no secret is stored.

on:
  workflow_dispatch:
    inputs:
      tag:
        description: The release's tag, vX.Y.Z
        required: true
        type: string
  pull_request:
    paths:
      - crates/jadpo-verifier/**
      - deploy/verifier/**
      - .github/workflows/verifier-image.yml

permissions:
  contents: read

concurrency:
  group: verifier-image-${{ inputs.tag || github.ref }}
  cancel-in-progress: false

env:
  IMAGE: ghcr.io/jadpo-dev/verifier
  ARCHIVE: jadpo-x86_64-unknown-linux-gnu.tar.xz

jobs:
  # Holds a read-only token: it starts the image, which runs code fetched
  # from a repository.
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 150
    permissions:
      contents: read
    env:
      TAG: ${{ inputs.tag }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.tag || github.sha }}
          persist-credentials: false
      # dist's workflow is building them when this starts.
      - name: Wait for the release's archive and check its attestation
        if: inputs.tag != ''
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          for _ in $(seq 360); do
            gh release download "$TAG" --repo "$GITHUB_REPOSITORY" --pattern "$ARCHIVE" --clobber && break
            sleep 20
          done
          gh attestation verify "$ARCHIVE" --repo "$GITHUB_REPOSITORY"
          tar -xJf "$ARCHIVE" --strip-components=1 --wildcards '*/jadpo'
          mv jadpo deploy/verifier/jadpo
      - name: Install the pinned Rust toolchain
        if: inputs.tag == ''
        run: |
          channel="$(sed -n 's/^channel = "\(.*\)"$/\1/p' rust-toolchain.toml)"
          rustup toolchain install "$channel" --profile minimal
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        if: inputs.tag == ''
        with:
          save-if: false
          cache-on-failure: true
      - name: Build this revision's jadpo
        if: inputs.tag == ''
        run: |
          cargo build --package jadpo-cli --bin jadpo
          cp target/debug/jadpo deploy/verifier/jadpo
      - name: Build the image
        run: docker build --tag "$IMAGE:candidate" deploy/verifier
      - name: Let a container make the sandbox's namespaces
        run: sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0
      - name: Start it and use it
        env:
          JADPO_VERIFIER_TOKEN: verifier-image-smoke-test-credential-0123456789
        run: python3 deploy/verifier/smoke.py "$IMAGE:candidate"
      - name: Keep the image for publishing
        if: inputs.tag != ''
        run: docker save "$IMAGE:candidate" | gzip > verifier-image.tar.gz
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: inputs.tag != ''
        with:
          name: verifier-image
          path: verifier-image.tar.gz
          retention-days: 1

  publish:
    needs: build
    if: inputs.tag != '' && vars.JADPO_VERIFIER_IMAGE == 'on'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read
      packages: write
      id-token: write
      attestations: write
    env:
      TAG: ${{ inputs.tag }}
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: verifier-image
      - name: Push it
        id: push
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          version="${TAG#v}"
          docker load --input verifier-image.tar.gz
          docker tag "$IMAGE:candidate" "$IMAGE:$version"
          printf '%s' "$GH_TOKEN" | docker login ghcr.io --username "$GITHUB_ACTOR" --password-stdin
          docker push "$IMAGE:$version"
          digest="$(docker inspect --format '{{index .RepoDigests 0}}' "$IMAGE:$version")"
          echo "digest=${digest#*@}" >> "$GITHUB_OUTPUT"
      - uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-name: ${{ env.IMAGE }}
          subject-digest: ${{ steps.push.outputs.digest }}
          push-to-registry: true
