name: Validation

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
    inputs:
      require-examples:
        description: Fail on a built feature no teaching example uses, as the phase's examples chunk does
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: validation-${{ github.ref }}
  cancel-in-progress: true

# The gate (tools/verify.py) split into its groups, one job each, run at
# once (docs/compiler-runtime.md §2.7). Each job keeps its own cargo cache,
# since each builds something different. `supported-language`, the check
# branch protection requires, passes only when every job passed.

# Line tables keep backtraces' file and line and spare the linker the rest
# of the debug information, for the test binaries.
env:
  CARGO_PROFILE_DEV_DEBUG: line-tables-only

jobs:
  lint:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      # Everything rust-toolchain.toml lists, which rustup would add anyway.
      - name: Install the pinned Rust toolchain
        run: |
          channel="$(sed -n 's/^channel = "\(.*\)"$/\1/p' rust-toolchain.toml)"
          rustup toolchain install "$channel" --profile minimal --component rustfmt --component clippy --target wasm32-unknown-unknown
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
      - name: Install Node for the pinned benchmark baseline type check
        uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Formatting, clippy, benchmark correctness and baseline types
        run: python3 tools/verify.py --group lint

  docs:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    # `jadpo test` runs projects with tables against a PostgreSQL server,
    # one for the job, named by JADPO_TEST_DATABASE_URL.
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      # PostgreSQL 16 with pgvector and PostGIS, built from
      # tools/postgres/Dockerfile (chunk 5.5v1), with durability off, as the
      # disposable servers local runs start have it (docs/compiler-runtime.md
      # §2.7); a service container can't be built or given the settings. It
      # builds and starts in the background while the toolchain installs.
      - name: Start PostgreSQL
        run: |
          (docker build --quiet --tag jadpo-postgres tools/postgres &&
            docker run --detach --name postgres --publish 5432:5432 \
              --env POSTGRES_USER=jadpo --env POSTGRES_PASSWORD=jadpo --env POSTGRES_DB=postgres \
              jadpo-postgres -c fsync=off -c synchronous_commit=off -c full_page_writes=off \
              -c max_connections=300) > "$RUNNER_TEMP/postgres.log" 2>&1 &
      # Everything rust-toolchain.toml lists, which rustup would add anyway.
      - name: Install the pinned Rust toolchain
        run: |
          channel="$(sed -n 's/^channel = "\(.*\)"$/\1/p' rust-toolchain.toml)"
          rustup toolchain install "$channel" --profile minimal --component rustfmt --component clippy --target wasm32-unknown-unknown
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
      - name: Wait for PostgreSQL
        timeout-minutes: 6
        run: |
          for _ in $(seq 300); do
            docker exec postgres pg_isready -h 127.0.0.1 -U jadpo -d postgres 2>/dev/null && exit 0
            sleep 1
          done
          cat "$RUNNER_TEMP/postgres.log"
          exit 1
      - name: The language pages and the teaching examples
        env:
          JADPO_TEST_DATABASE_URL: postgresql://jadpo:jadpo@127.0.0.1:5432/postgres
        run: python3 tools/verify.py --group docs

  tests:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    # The live PostgreSQL steps share one server, named by
    # JADPO_TEST_DATABASE_URL, and run at once; local runs start one
    # disposable server for the run instead.
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      # PostgreSQL 16 with pgvector and PostGIS, built from
      # tools/postgres/Dockerfile (chunk 5.5v1), with durability off, as the
      # disposable servers local runs start have it (docs/compiler-runtime.md
      # §2.7); a service container can't be built or given the settings. It
      # builds and starts in the background while the toolchain installs.
      - name: Start PostgreSQL
        run: |
          (docker build --quiet --tag jadpo-postgres tools/postgres &&
            docker run --detach --name postgres --publish 5432:5432 \
              --env POSTGRES_USER=jadpo --env POSTGRES_PASSWORD=jadpo --env POSTGRES_DB=postgres \
              jadpo-postgres -c fsync=off -c synchronous_commit=off -c full_page_writes=off \
              -c max_connections=300) > "$RUNNER_TEMP/postgres.log" 2>&1 &
      # Everything rust-toolchain.toml lists, which rustup would add anyway.
      - name: Install the pinned Rust toolchain
        run: |
          channel="$(sed -n 's/^channel = "\(.*\)"$/\1/p' rust-toolchain.toml)"
          rustup toolchain install "$channel" --profile minimal --component rustfmt --component clippy --target wasm32-unknown-unknown
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
      - name: Wait for PostgreSQL
        timeout-minutes: 6
        run: |
          for _ in $(seq 300); do
            docker exec postgres pg_isready -h 127.0.0.1 -U jadpo -d postgres 2>/dev/null && exit 0
            sleep 1
          done
          cat "$RUNNER_TEMP/postgres.log"
          exit 1
      - name: Install the declared TypeScript runtimes
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: examples/golden-todo/typescript/.node-version
          cache: npm
          cache-dependency-path: examples/golden-todo/typescript/package-lock.json
      - name: Install the declared Bun runtime
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version-file: examples/golden-todo/typescript/.bun-version
      - name: Every test, with live PostgreSQL
        env:
          JADPO_TEST_DATABASE_URL: postgresql://jadpo:jadpo@127.0.0.1:5432/postgres
          # Pull requests note a feature no example uses yet; a run started
          # by hand with require-examples fails on it.
          REQUIRE_EXAMPLES: ${{ inputs.require-examples && '--require-examples' || '' }}
        run: python3 tools/verify.py --group tests $REQUIRE_EXAMPLES

  # The differential run (docs/compiler-runtime.md §2.5 and §2.7, chunk
  # 8.1j): every page's project and teaching example compiled as modules
  # of one generated crate, one rustc invocation in the dev profile, and
  # every test run interpreted and compiled with the same records, against
  # a PostgreSQL container of its own. A job of its own, so the `tests`
  # job doesn't share its runner with a second build of the compiler.
  # Its budget is the job's timeout, 20 minutes (12 when chunk 8.1j set
  # it, about twice what it took with no cargo cache at all: 5 min 31 s
  # and 5 min 41 s in two runs). Route tests on workerd (chunk 8.2e) run
  # in the `wasm32` job, which the 12 minutes couldn't hold.
  compiled:
    runs-on: ubuntu-24.04
    # The corpus step takes about 9 minutes and saving the cache about one
    # more, which 12 minutes no longer held (2026-10-22).
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      # PostgreSQL 16 with pgvector and PostGIS, as the `tests` job has it:
      # the corpus's projects with vectors and geometries need both, and
      # teaching example 22 pgvector 0.8 or later.
      - name: Start PostgreSQL
        run: |
          (docker build --quiet --tag jadpo-postgres tools/postgres &&
            docker run --detach --name postgres --publish 5432:5432 \
              --env POSTGRES_USER=jadpo --env POSTGRES_PASSWORD=jadpo --env POSTGRES_DB=postgres \
              jadpo-postgres -c fsync=off -c synchronous_commit=off -c full_page_writes=off \
              -c max_connections=300) > "$RUNNER_TEMP/postgres.log" 2>&1 &
      # Everything rust-toolchain.toml lists, which rustup would add anyway.
      - name: Install the pinned Rust toolchain
        run: |
          channel="$(sed -n 's/^channel = "\(.*\)"$/\1/p' rust-toolchain.toml)"
          rustup toolchain install "$channel" --profile minimal --component rustfmt --component clippy --target wasm32-unknown-unknown
      # The harness's workspace and its target folder are kept under
      # target/jadpo-compiled/, so this cache keeps the registry crates the
      # generated crate depends on, built there, as well as the
      # workspace's; the repository's own crates are built afresh.
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
      - name: Wait for PostgreSQL
        timeout-minutes: 6
        run: |
          for _ in $(seq 300); do
            docker exec postgres pg_isready -h 127.0.0.1 -U jadpo -d postgres 2>/dev/null && exit 0
            sleep 1
          done
          cat "$RUNNER_TEMP/postgres.log"
          exit 1
      - name: The corpus compiled, its tests interpreted and compiled
        env:
          JADPO_TEST_DATABASE_URL: postgresql://jadpo:jadpo@127.0.0.1:5432/postgres
        run: python3 tools/verify.py --group compiled
      # The projects the step wrote into target/tmp/ hold folders called
      # `tests`, which the cache action takes for cargo's own and fails to
      # clean, with an error for each; nothing needs them again.
      - name: Remove the projects the step wrote
        if: always()
        run: rm -rf target/tmp

  wasm32:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    # The Workers deployable's test serves teaching example 23 under
    # workerd against a PostgreSQL server the Worker reaches over TCP
    # (chunk 8.2d), named by JADPO_TEST_DATABASE_URL.
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      # PostgreSQL 16 with pgvector and PostGIS, as the `tests` job has it,
      # built and started in the background while the toolchain installs.
      - name: Start PostgreSQL
        run: |
          (docker build --quiet --tag jadpo-postgres tools/postgres &&
            docker run --detach --name postgres --publish 5432:5432 \
              --env POSTGRES_USER=jadpo --env POSTGRES_PASSWORD=jadpo --env POSTGRES_DB=postgres \
              jadpo-postgres -c fsync=off -c synchronous_commit=off -c full_page_writes=off \
              -c max_connections=300) > "$RUNNER_TEMP/postgres.log" 2>&1 &
      # Everything rust-toolchain.toml lists, which rustup would add anyway.
      - name: Install the pinned Rust toolchain
        run: |
          channel="$(sed -n 's/^channel = "\(.*\)"$/\1/p' rust-toolchain.toml)"
          rustup toolchain install "$channel" --profile minimal --component rustfmt --component clippy --target wasm32-unknown-unknown
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
      - name: Wait for PostgreSQL
        timeout-minutes: 6
        run: |
          for _ in $(seq 300); do
            docker exec postgres pg_isready -h 127.0.0.1 -U jadpo -d postgres 2>/dev/null && exit 0
            sleep 1
          done
          cat "$RUNNER_TEMP/postgres.log"
          exit 1
      - name: The shared and runtime crates for wasm32
        env:
          JADPO_TEST_DATABASE_URL: postgresql://jadpo:jadpo@127.0.0.1:5432/postgres
        run: python3 tools/verify.py --group wasm32

  supported-language:
    needs: [lint, docs, tests, compiled, wasm32]
    if: always()
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Every job passed
        env:
          RESULTS: ${{ join(needs.*.result, ' ') }}
        run: |
          echo "lint, docs, tests, compiled, wasm32: $RESULTS"
          for result in $RESULTS; do
            [ "$result" = success ] || exit 1
          done
