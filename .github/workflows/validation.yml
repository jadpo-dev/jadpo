name: Language validation

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
    inputs:
      require_golden:
        description: Require the full golden application gate (currently blocked)
        type: boolean
        default: true

permissions:
  contents: read

concurrency:
  group: validation-${{ github.ref }}
  cancel-in-progress: true

jobs:
  supported-language:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: '1.2.20'
      - uses: actions/setup-node@v7
        with:
          node-version: '24.18.1'
          package-manager-cache: false
      - name: Install compiler and database test tools
        run: |
          rustup toolchain install 1.78.0 --profile minimal
          rustup override set 1.78.0
          sudo apt-get update
          sudo apt-get install -y postgresql-16 ruby
          echo /usr/lib/postgresql/16/bin >> "$GITHUB_PATH"
      - name: Run registered checks
        env:
          REQUIRE_GOLDEN: ${{ inputs.require_golden }}
        run: |
          flags=()
          if [[ "$REQUIRE_GOLDEN" == true ]]; then flags+=(--require-golden); fi
          python3 tools/verify.py "${flags[@]}"
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: validation-evidence
          path: build/validation/
          if-no-files-found: warn
