name: VS Code extension

# The VS Code extension (editors/vscode) on each Release (docs/language/
# 14-tooling.md, "Editor support"): packaged with vsce, its version the
# release's, attached to the Release, then published to the VS Code
# Marketplace and Open VSX once the Release's installers are out, so the
# extension never asks for a `jadpo` that can't be installed yet.
# release-please.yml starts it for each release it makes; it can also be
# run by hand for a tag. A pull request that touches the extension
# packages it too, testing it and publishing nothing.
#
# Publishing is switched off until the repository variable
# JADPO_VSCODE_PUBLISH is `on`, which needs, first: the Marketplace
# publisher `jadpo` and an Azure DevOps token for it in the VSCE_PAT
# secret, and the Open VSX namespace `jadpo` with a trusted publisher for
# this workflow, which needs no secret. Packaging and attaching run
# without them.

on:
  workflow_dispatch:
    inputs:
      tag:
        description: The release's tag, vX.Y.Z
        required: true
        type: string
  pull_request:
    paths:
      - editors/vscode/**
      - .github/workflows/vscode-extension.yml

permissions:
  contents: read

concurrency:
  group: vscode-extension-${{ inputs.tag || github.ref }}
  cancel-in-progress: false

jobs:
  # It runs the extension's own npm scripts, so it holds a read-only token;
  # `attach` alone writes to the release.
  package:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read
    outputs:
      version: ${{ steps.version.outputs.version }}
      file: ${{ steps.version.outputs.file }}
    defaults:
      run:
        working-directory: editors/vscode
    env:
      TAG: ${{ inputs.tag }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.tag || github.sha }}
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: editors/vscode/package-lock.json
      # The release's version, which the Marketplace takes only as
      # MAJOR.MINOR.PATCH; a pull request keeps package.json's.
      - id: version
        run: |
          if [ -n "$TAG" ]; then
            version="${TAG#v}"
          else
            version="$(node -p 'require("./package.json").version')"
          fi
          if ! printf '%s' "$version" | grep -Eq '^[0-9]+\.[0-9]+\.[0-9]+$'; then
            echo "::error::The extension's version must be MAJOR.MINOR.PATCH for the Marketplace; the tag gives \`$version\`."
            exit 1
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "file=jadpo-$version.vsix" >> "$GITHUB_OUTPUT"
      # No dependency's install script runs (`@vscode/vsce-sign`'s fetches
      # a binary that only signing needs, and nothing here signs).
      - run: npm ci --ignore-scripts --no-audit --no-fund
      - run: npm version "${{ steps.version.outputs.version }}" --no-git-tag-version --allow-same-version
      # The protocol test needs a `jadpo` binary and skips without one; the
      # language server's own tests run in validation.yml.
      - run: npm test
      - run: npx vsce package --skip-license --out "${{ steps.version.outputs.file }}"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: vscode-extension
          path: editors/vscode/${{ steps.version.outputs.file }}
          if-no-files-found: error

  # The packaged file attested and attached to the release: nothing is
  # checked out or run here but the attestation action and `gh`.
  attach:
    needs: package
    if: inputs.tag
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: write
      id-token: write
      attestations: write
    env:
      TAG: ${{ inputs.tag }}
      FILE: ${{ needs.package.outputs.file }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: vscode-extension
      # A GitHub artifact attestation, which `gh attestation verify` checks
      # (docs/documentation.md, "Installing").
      - uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-path: ${{ needs.package.outputs.file }}
      - name: Attach it to the release
        run: gh release upload "$TAG" "$FILE" --clobber --repo "$GITHUB_REPOSITORY"

  # dist's Release workflow for the tag, which release-please.yml started
  # just before this one, has to finish and publish the Release first.
  released:
    needs: [package, attach]
    if: inputs.tag && vars.JADPO_VSCODE_PUBLISH == 'on'
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    permissions:
      actions: read
      contents: read
    env:
      TAG: ${{ inputs.tag }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: Wait for the Release's installers
        run: |
          run=""
          for _ in $(seq 30); do
            run="$(gh run list --repo "$GITHUB_REPOSITORY" --workflow release.yml --event workflow_dispatch \
              --branch "$TAG" --limit 1 --json databaseId --jq '.[0].databaseId // empty')"
            [ -n "$run" ] && break
            sleep 20
          done
          if [ -z "$run" ]; then
            echo "::error::No Release run for $TAG: release.yml builds the installers and publishes the Release first."
            exit 1
          fi
          gh run watch "$run" --repo "$GITHUB_REPOSITORY" --exit-status --interval 60
          if [ "$(gh release view "$TAG" --repo "$GITHUB_REPOSITORY" --json isDraft --jq .isDraft)" != "false" ]; then
            echo "::error::The $TAG Release is still a draft, so its installers aren't out."
            exit 1
          fi

  marketplace:
    needs: [package, released]
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: vscode-extension
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24'
      - name: Publish to the VS Code Marketplace
        env:
          npm_config_ignore_scripts: "true"
          VSCE_PAT: ${{ secrets.VSCE_PAT }}
        run: npx --yes @vscode/vsce@4.1.0 publish --packagePath "${{ needs.package.outputs.file }}"

  open-vsx:
    needs: [package, released]
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    # Trusted publishing: Open VSX exchanges this job's OIDC token for a
    # short-lived one, so no token is stored (docs/documentation.md).
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: vscode-extension
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24'
      - name: Publish to Open VSX
        env:
          npm_config_ignore_scripts: "true"
        run: npx --yes ovsx@1.2.0 publish "${{ needs.package.outputs.file }}" --trusted-publishing
